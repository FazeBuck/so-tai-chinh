<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Tài Chính</title>
<meta name="description" content="Sổ thu chi cá nhân">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Tài Chính">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1426" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>html{background:#F3F1EC}@media (prefers-color-scheme:dark){html{background:#0B1426}}body{padding-top:env(safe-area-inset-top,0px)}</style>
<style>html{background:var(--bg)!important}body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: một cột kiểu điện thoại; 5 tab đáy (Tổng quan, Tài khoản, Thêm, Báo cáo, Khác); các màn con mở chồng lên có nút quay lại */
:root{
  /* Bento nền giấy (v14): nền giấy, xanh đậm, chữ Plus Jakarta Sans, thẻ bento, thanh tab nổi */
  --bg:#F3F1EC;--surface:#FBFAF7;--line:#E6E1D6;--track:#ECE8DF;--rule:#E6E1D6;
  --ink:#16213A;--ink-2:#5B6475;--ink-3:#868D9C;
  --accent:#1F4FA3;--accent-fg:#FFFFFF;--accent-soft:#E3EAF6;--link:#1F4FA3;
  --pos:#2E7D4F;--neg:#B8402F;--neg-soft:#F6E2D8;--warn:#986208;--warn-soft:#F3E7CC;
  --hero:#1F4FA3;--hero-ink:#FFFFFF;--hero-2:#D3DEF3;--hero-pos:#B6EBC9;--hero-neg:#FFC3B6;
  --nav:#16213A;--nav-on:#F3F1EC;--nav-on-ink:#16213A;--nav-off:#8D95A8;--nav-shadow:0 12px 28px -12px rgba(22,33,58,.55);
  --mint:#2E7D4F;--mint-bg:#E2EFE4;--coral:#B8452E;--coral-bg:#F6E2D8;--amber:#986208;--amber-bg:#F3E7CC;--lilac:#5747BE;--lilac-bg:#E7E3F3;--tile-on:#FFFFFF;
  --s1:#2F6FD6;--s2:#D9622B;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#7A5A3A;--s8:#6B5BD2;--s9:#0E8A9A;--s10:#A8781F;--sx:#9AA7AE;
  --k-food:#C8561F;--k-home:#7A5A3A;--k-move:#2F6FD6;--k-fun:#B04A7A;--k-edu:#6B5BD2;--k-give:#A8781F;--k-inc:#2E7D4F;--k-xfer:#5B6475;--k-ppl:#1F4FA3;
  --scrim:rgba(15,20,28,.45);
  --shadow:0 1px 2px rgba(22,33,58,.04);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:var(--font);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1426;--surface:#15213A;--line:#22304C;--track:#22304C;--rule:#22304C;--ink:#EEF2FA;--ink-2:#B0BBD3;--ink-3:#8592AD;
    --accent:#7FA2FF;--accent-fg:#0B1426;--accent-soft:#1D2D52;--link:#8EADFF;--pos:#6FD69C;--neg:#FF9A84;--neg-soft:#3A2228;--warn:#F1C164;--warn-soft:#352C1C;
    --hero:#2F5EE0;--hero-ink:#FFFFFF;--hero-2:#D6E1FF;--hero-pos:#B6EBC9;--hero-neg:#FFC3B6;
    --nav:#1C2A47;--nav-on:#EEF2FA;--nav-on-ink:#0B1426;--nav-off:#7D8AA6;--nav-shadow:0 12px 28px -12px rgba(0,0,0,.6);
    --mint:#6FD69C;--mint-bg:#15332A;--coral:#FF9A84;--coral-bg:#3A2228;--amber:#F1C164;--amber-bg:#352C1C;--lilac:#B4A7FF;--lilac-bg:#262447;--tile-on:#0B1426;
    --s1:#82AAF2;--s2:#F0915C;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2FA23A;--s7:#C9A27E;--s8:#A9A0EE;--s9:#4CC3D1;--s10:#E3BE68;--sx:#8791A3;
    --k-food:#FF9E78;--k-home:#C9A27E;--k-move:#8FB0FF;--k-fun:#F08CC4;--k-edu:#B4A7FF;--k-give:#E3BE68;--k-inc:#6FD69C;--k-xfer:#B0BBD3;--k-ppl:#8EADFF;
    --scrim:rgba(4,8,16,.6);--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0B1426;--surface:#15213A;--line:#22304C;--track:#22304C;--rule:#22304C;--ink:#EEF2FA;--ink-2:#B0BBD3;--ink-3:#8592AD;
    --accent:#7FA2FF;--accent-fg:#0B1426;--accent-soft:#1D2D52;--link:#8EADFF;--pos:#6FD69C;--neg:#FF9A84;--neg-soft:#3A2228;--warn:#F1C164;--warn-soft:#352C1C;
    --hero:#2F5EE0;--hero-ink:#FFFFFF;--hero-2:#D6E1FF;--hero-pos:#B6EBC9;--hero-neg:#FFC3B6;
    --nav:#1C2A47;--nav-on:#EEF2FA;--nav-on-ink:#0B1426;--nav-off:#7D8AA6;--nav-shadow:0 12px 28px -12px rgba(0,0,0,.6);
    --mint:#6FD69C;--mint-bg:#15332A;--coral:#FF9A84;--coral-bg:#3A2228;--amber:#F1C164;--amber-bg:#352C1C;--lilac:#B4A7FF;--lilac-bg:#262447;--tile-on:#0B1426;
    --s1:#82AAF2;--s2:#F0915C;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2FA23A;--s7:#C9A27E;--s8:#A9A0EE;--s9:#4CC3D1;--s10:#E3BE68;--sx:#8791A3;
    --k-food:#FF9E78;--k-home:#C9A27E;--k-move:#8FB0FF;--k-fun:#F08CC4;--k-edu:#B4A7FF;--k-give:#E3BE68;--k-inc:#6FD69C;--k-xfer:#B0BBD3;--k-ppl:#8EADFF;
    --scrim:rgba(4,8,16,.6);--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:430px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 100px}
.num{font-variant-numeric:tabular-nums}
.head{display:flex;align-items:center;gap:8px;padding-block:16px 8px;min-height:60px}
.head h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;flex:none}
.badge{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--warn-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--neg)}
.btn.block{width:100%;padding:12px;font-size:15px}
.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.hero .label{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-block:2px 10px}
.hero .split{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--ink-2)}
.hero .split b{color:var(--ink);font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.sec{margin-block:22px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:13px;font-weight:600;color:var(--ink-2);margin:0;text-transform:uppercase;letter-spacing:.05em}
.sec .sum{font-size:13px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.rowbtn{width:100%;background:none;border-width:1px 0 0;border-style:solid;border-color:var(--line);text-align:left}
.rowbtn:first-child{border-top:0}
.chev{color:var(--ink-3);font-size:18px;flex:none}
.ico{flex:none;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.row .name{flex:1;min-width:0}
.row .name div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name small{color:var(--ink-3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap}
.row .name small.wrap{white-space:normal}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.note{font-size:12px;color:var(--ink-3);margin:6px 4px 0}
.empty{padding:16px;color:var(--ink-3);font-size:13px;text-align:center}
.cols3{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:6px;text-align:left}
.cols3 small{display:block;color:var(--ink-2);font-size:12px}.cols3 b{font-size:14px;white-space:nowrap}

/* Thanh tab */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,430px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}
.tab{border:0;background:none;padding:10px 2px;border-radius:12px;color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab.add{background:var(--accent);color:var(--accent-fg);font-size:13px}
.tab.add[aria-selected="true"]{outline:2px solid var(--accent);outline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Biểu mẫu */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:none;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
.amount{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.amount label{font-size:13px;color:var(--ink-2)}
.amount .field{display:flex;align-items:baseline;gap:6px}
.amount input{flex:1;min-width:0;border:0;background:none;font-size:34px;font-weight:700;letter-spacing:-.02em;padding:0;outline:none}
.amount .cur{font-size:22px;font-weight:600;color:var(--ink-2)}
.amount.t-chi input,.amount.t-tra input{color:var(--neg)}.amount.t-thu input,.amount.t-nhan input{color:var(--pos)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
.allchip{font-weight:700}
.ghead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.gsel{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:600;padding:4px 0}
.gsel .tick{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;line-height:1}
.gsel[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.block{margin-top:16px}
.block>.cap{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll .chip{flex:none;white-space:nowrap}
.acc-chip small{display:block;font-size:11px;font-weight:400;opacity:.8}
.acc-chip{border-radius:12px;padding:8px 12px;text-align:left}
.text{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.text:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.two>div{min-width:0}
.two .cap{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
input[type="date"].text{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:46px}
.err{color:var(--neg);font-size:13px;margin-top:8px;min-height:18px}
.save{width:100%;margin-top:14px;border:0;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.save.ghost{background:var(--surface);color:var(--neg);border:1px solid var(--line);margin-top:10px}

/* Bảng chọn */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(100%,430px);max-height:86%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700}
.sheet header button{border:0;background:none;color:var(--accent);font-weight:600}
.sheet .body{overflow:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.grp{margin-bottom:14px}.grp h3{font-size:13px;color:var(--ink-2);margin:0 0 6px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--ink-2)}.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:min(92%,400px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* Tháng, tìm kiếm */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-block:8px}
.monthnav button{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;font-size:18px}
.monthnav b{font-size:15px}
.dayh{font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 4px 6px;display:flex;justify-content:space-between}

/* Thanh tiến độ và biểu đồ */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--neg)}
.tag{font-size:12px;font-weight:600}.tag.warn{color:var(--warn)}.tag.over{color:var(--neg)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:6px}
.donutwrap{display:flex;justify-content:center;padding-block:4px}
.chartsvg{width:100%;height:auto;display:block}
.chartsvg text{fill:var(--ink-2);font-family:var(--font);font-size:10px}
.chartsvg .grid{stroke:var(--line);stroke-width:1}
.readout{font-size:13px;color:var(--ink-2);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{color:var(--ink-2);font-weight:600;border-top:0}
.switch{width:46px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}.switch[aria-checked="true"]::after{transform:translateX(18px)}
.subcats{padding:0 14px 12px 62px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.subcats div{display:flex;justify-content:space-between}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink)}

/* Chuyển màn hình mượt */
.app{overflow-x:clip}
.chip,.seg button,.tab,.btn,.back,.switch,.save,.monthnav button{transition:background-color .15s,color .15s,border-color .15s,transform .1s}
.chip:active,.btn:active,.tab:active,.back:active,.save:active,.monthnav button:active{transform:scale(.96)}
.rowbtn{transition:background-color .12s}
.rowbtn:active{background:var(--accent-soft)}
.bar i{transition:width .3s ease}
@media (prefers-reduced-motion:no-preference){
  .a-push{animation:aPush .26s cubic-bezier(.2,.8,.2,1)}
  .a-pop{animation:aPop .26s cubic-bezier(.2,.8,.2,1)}
  .a-tab{animation:aTab .2s ease-out}
  @keyframes aPush{from{opacity:0;transform:translateX(32px)}}
  @keyframes aPop{from{opacity:0;transform:translateX(-32px)}}
  @keyframes aTab{from{opacity:0;transform:translateY(8px)}}
  .sheet-bg{animation:bgIn .2s ease-out}
  .sheet{animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}
  .sheet-bg.closing{animation:bgOut .18s ease-in forwards}
  .sheet-bg.closing .sheet{animation:sheetOut .18s ease-in forwards}
  @keyframes bgIn{from{opacity:0}}
  @keyframes bgOut{to{opacity:0}}
  @keyframes sheetIn{from{transform:translateY(40px);opacity:.6}}
  @keyframes sheetOut{to{transform:translateY(40px);opacity:0}}
}
.daterow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-block:8px}
.daterow>div{min-width:0}
.daterow label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:4px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px;flex:1;margin-inline:8px;min-width:0}
.pkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkgrid .chip{padding:10px 4px;text-align:center}
.accgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.accgrid .chip{min-width:0;white-space:normal}
.acc-chip b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptable tr[data-act]{cursor:pointer}
.ptable tr.sel td{background:var(--accent-soft)}
.ptable td,.ptable th{padding:9px 4px;font-size:13px}
.ptable td:first-child{padding-left:6px;white-space:nowrap}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:10px}
.filters button{text-align:left;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:0}
.filters small{display:block;font-size:11px;color:var(--ink-2)}
.filters b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
(function(){
  /* ================= DỮ LIỆU MẪU (v7: bàn phím số trong app, số dư theo kỳ, gộp tài khoản ngừng sử dụng) ================= */
  var S={hide:false,faceid:false,drive:false,auto:'weekly',last:'',demo:true,lastFile:''};

           thu:['Thu nhập · Lương','Thu nhập · Tiền lãi','Thu nhập · Thưởng','Thu nhập · Được cho/tặng']};
  var accounts=[
    {id:'cash',name:'Ví tiền mặt',group:'bank',bal:6000000,active:true},
    {id:'tcb',name:'Techcombank',group:'bank',bal:5000000,active:true},

    {id:'momo',name:'Ví điện tử cũ',group:'bank',bal:0,active:false}
  ];

  var GNAME={bank:'Tiền mặt / Ngân hàng',credit:'Thẻ tín dụng',invest:'Đầu tư'};
  var BUD_DEF={'Ăn uống':5000000,'Gia đình':2000000,'Hưởng thụ':1000000,'Phát triển bản thân':2500000,'Trang phục':1000000};
  var BUDY_DEF={'Hưởng thụ · Du lịch':60000000,'Sức khỏe · Bảo hiểm':26000000,'Hiếu hỉ':30000000};
  var BUD=JSON.parse(JSON.stringify(BUD_DEF)),BUDY=JSON.parse(JSON.stringify(BUDY_DEF));
  var owed={},held={},P={},txs=[],nextId=1;
  var TYPE_LABEL={chi:'Chi',thu:'Thu',chuyen:'Chuyển',ung:'Ứng hộ',giu:'Giữ hộ',nhan:'Nhận lại',tra:'Trả lại',dc:'Điều chỉnh',tl:'Chuyến đi'};

  /* ================= TIỆN ÍCH ================= */
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return n<10?'0'+n:''+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  var TODAY=new Date(),THIS_YEAR=TODAY.getFullYear(),TODAY_ISO=iso(TODAY),THIS_MONTH=TODAY_ISO.slice(0,7);
  function todayISO(){return iso(new Date())}
  function nowTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
  function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return iso(d)}
  function fmt(n){if(S.hide)return '••••••';var s=Math.abs(Math.round(n)).toLocaleString('vi-VN');return (n<0?'−':'')+s+' ₫'}
  function fmtF(n){var s=Math.abs(Math.round(n)).toLocaleString('vi-VN');return (n<0?'−':'')+s+' ₫'}
  function tr(n){return (Math.round(n/100000)/10).toString().replace('.',',')+' tr'}
  function dmy(s){var p=s.split('-');return p[2]+'/'+p[1]}
  function dmyFull(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
  function acc(id){for(var i=0;i<accounts.length;i++)if(accounts[i].id===id)return accounts[i]}
  function active(){return accounts.filter(function(a){return a.active})}
  function sumObj(o){var t=0;for(var k in o)if(o[k]>0)t+=o[k];return t}
  function monthLabel(m){var p=m.split('-');return 'Tháng '+parseInt(p[1],10)+'/'+p[0]}
  function shiftMonth(m,d){var p=m.split('-'),x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1)}
  function parts(cat){var p=(cat||'').split(' · ');return [p[0]||'',p[1]||p[0]||'']}
  function parseMoney(el){var v=el?el.value:'';var neg=/^\s*-/.test(v);var n=parseInt(v.replace(/\D/g,''),10)||0;return neg?-n:n}

  function applyTx(t,d){
    var a=acc(t.acc),m=t.amount*d;
    switch(t.type){
      case 'chi':a.bal-=m;break;
      case 'thu':a.bal+=m;break;
      case 'chuyen':a.bal-=m;acc(t.to).bal+=m;break;
      case 'ung':a.bal-=m;owed[t.person]=(owed[t.person]||0)+m;break;
      case 'giu':a.bal+=m;held[t.person]=(held[t.person]||0)+m;break;
      case 'nhan':a.bal+=m;owed[t.person]=(owed[t.person]||0)-m;break;
      case 'tra':a.bal-=m;held[t.person]=(held[t.person]||0)-m;break;
      case 'dc':a.bal+=t.delta*d;break;
    }
  }
  function sortTx(){txs.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id})}
  function ensurePerson(n){if(!P[n])P[n]={hidden:false};else P[n].hidden=false}
  function canonPerson(name){
    var v=name.trim().replace(/\s+/g,' '),k=v.toLowerCase();
    for(var n in P)if(n.toLowerCase()===k)return n;
    return v;
  }
  function addTx(t){t.id=nextId++;txs.push(t);if(t.person)ensurePerson(t.person);applyTx(t,1);sortTx();return t}
  function findTx(id){for(var i=0;i<txs.length;i++)if(txs[i].id===id)return txs[i]}
  function removeTx(id){for(var i=0;i<txs.length;i++)if(txs[i].id===id){if(!txs[i].trip)applyTx(txs[i],-1);txs.splice(i,1);return}}

  function seedTime(type,cat,day){
    var base={'Ăn uống · Cafe':[8,30],'Ăn uống · Ăn tiệm':[12,10],'Ăn uống · Đi chợ/siêu thị':[17,40],'Đi lại · Xăng xe':[18,10],'Thu nhập · Lương':[9,0]}[cat]||(type==='chuyen'?[20,0]:[10,30]);
    return pad(base[0])+':'+pad((base[1]+(day%4)*7)%60);
  }
  function seed(){
    var y=TODAY.getFullYear(),mo=TODAY.getMonth();
    for(var k=5;k>=0;k--){
      var base=new Date(y,mo-k,1),dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
      var ym=base.getFullYear()+'-'+pad(base.getMonth()+1);
      var put=function(day,type,cat,a,amt,extra){
        if(day>dim)return;var d=ym+'-'+pad(day);if(d>TODAY_ISO)return;
        var t={type:type,amount:amt,acc:a,date:d,cat:cat,time:seedTime(type,cat,day)};if(extra)for(var q in extra)t[q]=extra[q];addTx(t)
      };
      put(5,'thu','Thu nhập · Lương','tcb',30000000);
      if(k===2)put(15,'thu','Thu nhập · Thưởng','tcb',8000000);
      put(20,'thu','Thu nhập · Tiền lãi','ssi',420000+k*10000);
      put(12,'chi','Hóa đơn, dịch vụ · Điện thoại','tcb',520000+(k%3)*80000);
      put(3,'chi','Hóa đơn, dịch vụ · Internet, truyền hình','vib',250000);
      [2,6,9,13,17,21,25].forEach(function(d,i){put(d,'chi','Ăn uống · Cafe','cash',45000)});
      [3,7,10,14,18,22,26].forEach(function(d,i){put(d,'chi','Ăn uống · Ăn tiệm','vib',65000+i*5000)});
      [4,11,18,25].forEach(function(d,i){put(d,'chi','Ăn uống · Đi chợ/siêu thị','vib',380000+i*45000)});
      [8,22].forEach(function(d){put(d,'chi','Đi lại · Xăng xe','vib',120000)});
      put(14,'chi','Hưởng thụ · Giải trí','card',800000);
      if(k===1)put(15,'chi','Hưởng thụ · Du lịch','card',6500000);
      if(k===3)put(15,'chi','Hưởng thụ · Du lịch','vib',3200000);
      if(k%2===0)put(10,'chi','Phát triển bản thân · Học hành','tcb',1500000);
      put(16,'chi','Hiếu hỉ · Biếu tặng','tcb',500000+(k%3)*250000);
      if(k%2===1)put(17,'chi','Hiếu hỉ · Thăm hỏi, ma chay','tcb',350000);
      if(k%2===0)put(19,'chi','Hưởng thụ · Làm đẹp, mỹ phẩm','cash',300000);
      if(k%2===1)put(23,'chi','Phát triển bản thân · Học hành','vib',180000);
      put(1,'chuyen',null,'tcb',3000000,{to:'vib'});
      put(6,'chuyen',null,'tcb',15000000,{to:'ssi'});
      put(28,'chuyen',null,'tcb',2000000,{to:'card'});
    }
    addTx({type:'giu',amount:5000000,person:'Chị Lan',acc:'tcb',date:daysAgo(3),note:'',time:'15:20'});
    addTx({type:'ung',amount:1200000,person:'Minh',acc:'tcb',date:daysAgo(1),note:'Tiền khách sạn',time:'19:05'});
    addTx({type:'ung',amount:350000,person:'Bạn A',acc:'cash',date:daysAgo(10),note:'Ăn tối chung',time:'20:15'});
    addTx({type:'nhan',amount:150000,person:'Bạn A',acc:'cash',date:daysAgo(5),note:'',time:'18:30'});
    addTx({type:'ung',amount:500000,person:'Anh Tuấn',acc:'cash',date:daysAgo(58),note:'Ăn tối',time:'20:00'});
    addTx({type:'nhan',amount:500000,person:'Anh Tuấn',acc:'cash',date:daysAgo(55),note:'',time:'10:00'});
    addTx({type:'giu',amount:2000000,person:'Cô Hà',acc:'tcb',date:daysAgo(90),note:'',time:'14:00'});
    addTx({type:'tra',amount:2000000,person:'Cô Hà',acc:'tcb',date:daysAgo(75),note:'',time:'09:30'});
  }

  /* ================= THỐNG KÊ ================= */
  function monthTotals(m){var thu=0,chi=0;txs.forEach(function(t){if(t.date.slice(0,7)!==m)return;if(t.type==='thu')thu+=t.amount;if(t.type==='chi')chi+=t.amount});return {thu:thu,chi:chi}}
  function keyOrder(kind){var k=[];CATS[kind].forEach(function(g){if(kind==='chi')k.push(g.g);else g.i.forEach(function(i){k.push(i)})});return k}
  function rangeOf(p,m){
    var y=+m.slice(0,4),mo=+m.slice(5);
    if(p==='month')return {from:m+'-01',to:m+'-31',label:monthLabel(m),key:m,short:'T'+mo};
    if(p==='quarter'){var q=Math.floor((mo-1)/3),a=q*3+1;return {from:y+'-'+pad(a)+'-01',to:y+'-'+pad(a+2)+'-31',label:'Quý '+(q+1)+'/'+y,key:y+'Q'+(q+1),short:'Q'+(q+1)}}
    return {from:y+'-01-01',to:y+'-12-31',label:'Năm '+y,key:''+y,short:''+y};
  }
  function qStart(m){var y=+m.slice(0,4),mo=+m.slice(5);return y+'-'+pad(Math.floor((mo-1)/3)*3+1)}
  var RGMAX={month:24,quarter:16,year:10},RGUNIT={month:'tháng',quarter:'quý',year:'năm'};
  function pIdx(p,m){var y=+m.slice(0,4),mo=+m.slice(5);return p==='month'?y*12+mo-1:p==='quarter'?y*4+Math.floor((mo-1)/3):y}
  function pKey(p,i){if(p==='month')return Math.floor(i/12)+'-'+pad(i%12+1);if(p==='quarter')return Math.floor(i/4)+'-'+pad((i%4)*3+1);return i+'-01'}
  function pLabel(p,m){var y=m.slice(0,4),mo=+m.slice(5);return p==='month'?'T'+mo+'/'+y:p==='quarter'?'Q'+(Math.floor((mo-1)/3)+1)+'/'+y:y}
  function rgP(tg){return tg==='A'?A.p:'year'}
  function rgGet(tg){return tg==='A'?A.rg[A.p]:R.rgY}
  function rgSetEnd(tg,end,m){
    var p=rgP(tg),rg=rgGet(tg),cap=RGMAX[p],now=pIdx(p,THIS_MONTH),v=Math.min(pIdx(p,m),now),f=pIdx(p,rg.f),t=pIdx(p,rg.t);
    if(end==='f'){f=v;if(t<f)t=f;if(t-f+1>cap)t=Math.min(f+cap-1,now)}
    else{t=v;if(f>t)f=t;if(t-f+1>cap)f=t-cap+1}
    rg.f=pKey(p,f);rg.t=pKey(p,t);
  }
  function shiftP(p,m,d){return shiftMonth(m,p==='month'?d:p==='quarter'?3*d:12*d)}
  function totalsR(r){var thu=0,chi=0;txs.forEach(function(t){if(t.date<r.from||t.date>r.to)return;if(t.type==='thu')thu+=t.amount;if(t.type==='chi')chi+=t.amount});return {thu:thu,chi:chi}}
  function monthTotals(m){return totalsR(rangeOf('month',m))}
  function groupTotals(r,kind){
    var map={},order=keyOrder(kind);
    txs.forEach(function(t){
      if(t.type!==kind||t.date<r.from||t.date>r.to)return;
      var p=parts(t.cat),key=kind==='chi'?p[0]:p[1];
      if(!map[key])map[key]={key:key,total:0,items:{}};
      map[key].total+=t.amount;map[key].items[p[1]]=(map[key].items[p[1]]||0)+t.amount;
    });
    var out=[];for(var k in map)out.push(map[k]);
    out.forEach(function(o){var i=order.indexOf(o.key);o.slot=i<0?-1:i});
    out.sort(function(a,b){return b.total-a.total});
    return out;
  }
  function slotColor(slot){return slot>=0&&slot<10?'var(--s'+(slot+1)+')':'var(--sx)'}
  function spentGroup(m,g){var t=0;txs.forEach(function(x){if(x.type==='chi'&&x.date.slice(0,7)===m&&parts(x.cat)[0]===g&&!(x.cat in BUDY))t+=x.amount});return t}
  function spentYear(y,k){var t=0;txs.forEach(function(x){if(x.type==='chi'&&x.date.slice(0,4)===y&&(x.cat===k||parts(x.cat)[0]===k))t+=x.amount});return t}

  /* ================= ĐIỀU HƯỚNG ================= */
  var tab='home',stack=[{v:'home'}];
  function newH(a){return {p:'month',m:THIS_MONTH,from:THIS_MONTH+'-01',to:TODAY_ISO,type:'all',q:'',acc:a||null}}
  var H=newH(null);
  var R={p:'month',m:THIS_MONTH,kind:'chi',open:null,tab:'tc',rgY:{f:(THIS_YEAR-4)+'-01',t:THIS_YEAR+'-01'}};
  var A={kind:'chi',p:'month',cats:[],accs:[],sel:null,rg:{month:{f:shiftMonth(THIS_MONTH,-11),t:THIS_MONTH},quarter:{f:shiftMonth(qStart(THIS_MONTH),-9),t:qStart(THIS_MONTH)},year:{f:(THIS_YEAR-4)+'-01',t:THIS_YEAR+'-01'}}};

  /* ================= SỐ DƯ THEO KỲ (v7) ================= */
  function balCur(){return BL.all?active().map(function(x){return x.id}):BL.accs.filter(function(id){return acc(id)})}
  function selIds(){return balCur()}
  function balSet(ids){
    var actIds=active().map(function(x){return x.id});

  function balLabel(){
    if(BL.all)return 'Tất cả tài khoản đang dùng ('+active().length+')';
    var sel=BL.accs.filter(function(id){return acc(id)});
    if(!sel.length)return 'Chưa chọn tài khoản';
    for(var i=0;i<GROUPS.length;i++){
      var gi=active().filter(function(a){return a.group===GROUPS[i][0]}).map(function(a){return a.id});
      if(gi.length>1&&gi.length===sel.length&&gi.every(function(x){return sel.indexOf(x)>=0}))return GROUPS[i][1]+' ('+gi.length+')';
    }
    return sel.length===1?acc(sel[0]).name:acc(sel[0]).name+' + '+(sel.length-1)+' tài khoản';
  }
  function flowOf(t,ids){
    if(t.trip)return 0;
    var a=ids.indexOf(t.acc)>=0,b=!!t.to&&ids.indexOf(t.to)>=0,m=t.amount;
    switch(t.type){
      case 'chi':case 'ung':case 'tra':return a?-m:0;
      case 'thu':case 'giu':case 'nhan':return a?m:0;
      case 'chuyen':return (b?m:0)-(a?m:0);
      case 'dc':case 'tl':return a?t.delta:0;
    }
    return 0;
  }
  function flowKey(t){
    switch(t.type){
      case 'chi':return parts(t.cat)[0];
      case 'thu':return parts(t.cat)[1];
      case 'chuyen':return 'Chuyển khoản';
      case 'ung':return 'Ứng hộ';
      case 'giu':return 'Giữ hộ';
      case 'nhan':return 'Nhận lại';
      case 'tra':return 'Trả lại';
    }
    if(t.type==='tl')return 'Ứng trước chuyến đi';
    return 'Điều chỉnh số dư';
  }
  function sgnFmt(n){return (n>0&&!S.hide?'+':'')+fmt(n)}

  function vBal(){
    var ids=selIds(),curBal=0;ids.forEach(function(id){curBal+=acc(id).bal});
    var r=rangeOf(BL.p,BL.m),inR=[],after=0,fromOn=0;
    txs.forEach(function(t){
      var f=flowOf(t,ids);
      if(t.date>=r.from)fromOn+=f;
      if(t.date>r.to)after+=f;
      if(!t.trip&&t.date>=r.from&&t.date<=r.to&&(ids.indexOf(t.acc)>=0||(t.to&&ids.indexOf(t.to)>=0)))inR.push({t:t,f:f});
    });
    var open=curBal-fromOn,close=curBal-after,net=close-open;
    var h=head('Số dư theo kỳ','<button class="link" data-act="hide" type="button">'+(S.hide?'Hiện số':'Ẩn số')+'</button>');
    h+='<button type="button" class="pill2" style="width:100%" data-act="balAcc" aria-label="Chọn tài khoản"><small>Tài khoản</small><b>'+esc(balLabel())+'</b><span aria-hidden="true">▾</span></button>';
    if(!ids.length)return h+'<div class="card empty" style="margin-top:12px">Chưa chọn tài khoản nào. Bấm ô Tài khoản ở trên để chọn.</div>';
    h+='<div class="hero" style="margin-top:10px"><div class="label"><span>Số dư hiện tại</span></div><div class="big num '+(curBal<0?'neg':'')+'" style="margin-bottom:0">'+fmt(curBal)+'</div></div>';
    h+='<div class="seg" style="margin-top:12px">'+[['month','Tháng'],['quarter','Quý'],['year','Năm']].map(function(x){return '<button type="button" data-act="bp" data-a="'+x[0]+'" aria-pressed="'+(BL.p===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
    var selKey=rangeOf(BL.p,BL.m).key;

    h+='<div class="card" style="margin-top:12px"><div class="bcap">'+esc(r.label)+'</div><div class="brow"><span>Số dư đầu kỳ</span><b class="num">'+fmt(open)+'</b></div><div class="brow"><span>Số dư cuối kỳ</span><b class="num">'+fmt(close)+'</b></div><div class="brow total"><span>Chênh lệch</span><b class="num '+(net<0?'neg':net>0?'pos':'')+'">'+sgnFmt(net)+'</b></div></div>';
    if(ids.length>1)h+='<p class="note">Chuyển khoản giữa các tài khoản đang chọn không tính vào chênh lệch.</p>';
    if(!inR.length){
      h+='<div class="card empty" style="margin-top:12px">Kỳ này chưa có giao dịch ở tài khoản đã chọn.</div>';
    }else if(BL.p==='month'){
      var dn={},last='',opened=false;
      inR.forEach(function(x){dn[x.t.date]=(dn[x.t.date]||0)+x.f});
      inR.forEach(function(x){
        if(x.t.date!==last){if(opened)h+='</div>';h+='<div class="dayh"><span>'+dayLabel(x.t.date)+'</span><span class="num">'+sgnFmt(dn[x.t.date])+'</span></div><div class="list">';last=x.t.date;opened=true}
        h+=txRow(x.t);
      });

      var start=r.from.slice(0,7),cnt=BL.p==='quarter'?3:12,mks=[];
      for(var k=0;k<cnt;k++){var mk0=shiftMonth(start,k);if(mk0<=THIS_MONTH)mks.push(mk0)}
      mks.reverse().forEach(function(mk){
        var arr=inR.filter(function(x){return x.t.date.slice(0,7)===mk});if(!arr.length)return;
        var mnet=0,map={},aft=0;
        arr.forEach(function(x){mnet+=x.f;var kk=flowKey(x.t);map[kk]=(map[kk]||0)+x.f});
        txs.forEach(function(t){if(t.date>mk+'-31')aft+=flowOf(t,ids)});
        var ks=Object.keys(map).filter(function(q){return Math.round(map[q])!==0}).sort(function(a,b){return Math.abs(map[b])-Math.abs(map[a])});
        h+='<div class="list" style="margin-top:12px"><button type="button" class="row rowbtn" data-act="bMonth" data-a="'+mk+'"><div class="name"><div style="font-weight:700">Tháng '+(+mk.slice(5))+'/'+mk.slice(0,4)+'</div><small>Cuối tháng '+fmt(curBal-aft)+'</small></div><div class="amt num '+(mnet<0?'neg':mnet>0?'pos':'')+'">'+sgnFmt(mnet)+'</div><span class="chev">›</span></button>';
        function crow(label,v){return '<div class="row cat"><div class="name"><div>'+esc(label)+'</div></div><div class="amt num '+(v<0?'neg':'pos')+'">'+sgnFmt(v)+'</div></div>'}

        if(ks.length>5){var restT=0;ks.slice(5).forEach(function(q){restT+=map[q]});h+=crow('Các mục khác ('+(ks.length-5)+')',restT)}
        h+='</div>';
      });
      h+='<p class="note">Bấm vào tên tháng để xem từng ngày của tháng đó.</p>';
    }

  /* ================= NGƯỜI (ỨNG HỘ / GIỮ HỘ) ================= */
  function lastDate(n){for(var i=0;i<txs.length;i++)if(txs[i].person===n)return txs[i].date;return ''}
  function pStat(n){var o=Math.max(owed[n]||0,0),h=Math.max(held[n]||0,0);return {o:o,h:h,bal:o+h>0,n:txs.filter(function(t){return t.person===n}).length,last:lastDate(n)}}
  function curPerson(){return cur().a.split('|').slice(1).join('|')}
  function personSuggest(){
    var now=Date.parse(todayISO()),out=[];
    Object.keys(P).forEach(function(n){
      if(P[n].hidden)return;var s=pStat(n),last=s.last;
      if(s.bal||(last&&(now-Date.parse(last))/864e5<=15))out.push({n:n,last:last||''});
    });
    out.sort(function(a,b){return a.last<b.last?1:a.last>b.last?-1:0});
    return out.slice(0,8).map(function(x){return x.n});
  }
  function personNote(){
    var el=$('person'),nt=$('personNote');if(!el||!nt)return;
    var v=el.value.trim().replace(/\s+/g,' ');
    if(!v){nt.textContent='Người mới chỉ cần gõ tên, app tự thêm. Người đã tất toán không hiện ở đây, gõ tên là dùng lại.';return}
    var c=canonPerson(v);
    if(P[c]){var s=pStat(c);nt.textContent=s.bal?'Đang theo dõi «'+c+'».':(P[c].hidden?'«'+c+'» đang ẩn, lưu xong sẽ hiện lại.':'Dùng lại «'+c+'» (đã tất toán).')}
    else nt.textContent='Người mới «'+v+'», app sẽ tự thêm khi lưu.';
  }
  function personRow(n){
    var s=pStat(n),sub='';
    if(s.bal)sub=(s.o?'Nợ bạn':'')+(s.o&&s.h?' · ':'')+(s.h?'Bạn giữ hộ':'');
    else sub=s.n?'Lần cuối '+dmy(s.last):'Chưa có giao dịch';
    var amt=s.bal?(s.o&&s.h?'2 khoản':fmt(s.o||s.h)):'';
    return '<button type="button" class="row rowbtn" data-go="person" data-a="p|'+esc(n)+'"><div class="ico">'+esc(n.charAt(0).toUpperCase())+'</div><div class="name"><div>'+esc(n)+'</div><small>'+sub+'</small></div>'+(amt?'<div class="amt num">'+amt+'</div>':'')+'<span class="chev">›</span></button>';
  }
  function vPeople(){
    var g={act:[],set:[],hid:[]},names=Object.keys(P);
    names.forEach(function(n){var s=pStat(n);if(s.bal)g.act.push(n);else if(P[n].hidden)g.hid.push(n);else g.set.push(n)});
    ['act','set','hid'].forEach(function(k){g[k].sort(function(a,b){var x=pStat(a).last,y=pStat(b).last;return x<y?1:x>y?-1:0})});
    var h=head('Người ứng hộ, giữ hộ');
    h+='<p class="note" style="margin-top:0">Người mới tự thêm khi bạn gõ tên lúc nhập Ứng hộ hoặc Giữ hộ. Tất toán xong thì người đó tự rời danh sách gợi ý. Lịch sử luôn được giữ.</p>';
    function sec(title,arr,empty){h+='<div class="sec"><h2>'+title+' ('+arr.length+')</h2></div><div class="list">'+(arr.length?arr.map(personRow).join(''):'<div class="empty">'+empty+'</div>')+'</div>'}
    sec('Đang theo dõi',g.act,'Không ai đang nợ bạn hoặc gửi tiền bạn giữ');
    sec('Đã tất toán',g.set,'Chưa có ai');
    if(g.hid.length)sec('Đã ẩn',g.hid,'');
    return h;
  }
  function mrow(label,sub,act,danger){return '<button type="button" class="row rowbtn" data-act="'+act+'"><div class="name"><div'+(danger?' style="color:var(--neg)"':'')+'>'+label+'</div><small>'+sub+'</small></div><span class="chev">›</span></button>'}

  function movePerson(src,dst){
    txs.forEach(function(t){if(t.person===src)t.person=dst});
    if(owed[src]!==undefined){owed[dst]=(owed[dst]||0)+owed[src];delete owed[src]}
    if(held[src]!==undefined){held[dst]=(held[dst]||0)+held[src];delete held[src]}
    if(src!==dst){var hid=P[dst]?P[dst].hidden:P[src].hidden;P[dst]={hidden:hid};delete P[src]}
    if(pStat(dst).bal)P[dst].hidden=false;
  }

  /* Tự học: gợi ý hạng mục, tài khoản, người theo lịch sử (số tiền gần giống, giờ trong ngày, mới hay cũ) */
  function predictAgg(type,amount,ctxCat){
    var now=new Date(),hn=now.getHours()+now.getMinutes()/60,agg={cat:{},acc:{},to:{},person:{}},base=Date.parse(todayISO());
    txs.forEach(function(t){
      if(t.type!==type)return;
      if(ctxCat&&t.cat!==ctxCat)return;
      var w=Math.pow(0.5,Math.max(0,(base-Date.parse(t.date))/864e5)/90);
      if(amount>0)w*=Math.exp(-Math.abs(Math.log(t.amount/amount))/0.4);
      if(t.time){var h=parseInt(t.time.slice(0,2),10)+parseInt(t.time.slice(3,5),10)/60,dh=Math.abs(h-hn);dh=Math.min(dh,24-dh);w*=dh<=1.5?1:dh<=3?0.6:0.3}
      if(t.cat)agg.cat[t.cat]=(agg.cat[t.cat]||0)+w;
      agg.acc[t.acc]=(agg.acc[t.acc]||0)+w;
      if(t.to)agg.to[t.to]=(agg.to[t.to]||0)+w;
      if(t.person)agg.person[t.person]=(agg.person[t.person]||0)+w;
    });
    return agg;
  }
  function best(map){var bk=null,bv=0,sum=0;for(var k in map){sum+=map[k];if(map[k]>bv){bv=map[k];bk=k}}return {key:bk,conf:sum?bv/sum:0,w:bv}}
  function applyAuto(){
    if(st.editId||!$('amount')||spForeign())return;
    var amt=parseMoney($('amount'));if(!amt)return;
    var t=st.type,agg=predictAgg(t,amt),b;
    if((t==='chi'||t==='thu')&&!st.catManual){b=best(agg.cat);if(b.key&&b.conf>=0.4&&b.w>=0.05){st.cat=b.key;st.catAuto=true}else if(st.catAuto){st.cat=null;st.catAuto=false}}
    if(!st.accManual){var a2=((t==='chi'||t==='thu')&&st.cat)?predictAgg(t,amt,st.cat):agg;b=best(a2.acc);if(b.key&&b.conf>=0.4&&b.w>=0.05&&acc(b.key)&&acc(b.key).active){st.acc=b.key;st.accAuto=true}}
    if(t==='chuyen'&&!st.toManual){b=best(agg.to);if(b.key&&b.conf>=0.4&&b.w>=0.05&&acc(b.key)&&acc(b.key).active&&b.key!==st.acc)st.to=b.key}
    fixTo();
    if((t==='ung'||t==='giu')&&!st.personManual){b=best(agg.person);var pi=$('person');if(b.key&&b.conf>=0.5&&b.w>=0.05&&(!pi.value.trim()||st.personAuto)){pi.value=b.key;st.personAuto=true}}
    renderForm();
  }
  function words(n){
    if(!n)return '';var p=[],x=n,v=Math.floor(x/1e9);
    if(v){p.push(v+' tỷ');x-=v*1e9}
    v=Math.floor(x/1e6);if(v){p.push(v+' triệu');x-=v*1e6}
    v=Math.floor(x/1e3);if(v){p.push(v+' nghìn');x-=v*1e3}
    if(x)p.push(x+' đồng');
    return p.join(' ')+(x?'':' đồng');
  }

        var fav=ks.concat(FAV[t].filter(function(x){return ks.indexOf(x)<0}));if(st.cat&&fav.indexOf(st.cat)<0)fav.unshift(st.cat);fav=fav.slice(0,8);

  function readForm(){st.amount=spForeign()?fgnNum($('amount').value):parseMoney($('amount'));st.person=$('person').value.trim();st.memo=$('memo').value.trim();st.date=$('date').value||todayISO()}
  function saveTx(){
    readForm();var t=st.type,err='';
    if(t==='chi'&&st.kind!=='none'&&!st.editId)return saveSplit();
    if(!st.amount)err='Nhập số tiền.';
    else if((t==='chi'||t==='thu')&&!st.cat)err='Chọn hạng mục.';
    else if((t==='ung'||t==='giu')&&!st.person)err='Nhập tên người.';
    else if(t==='chuyen'&&(!st.to||st.to===st.acc))err='Chọn hai tài khoản khác nhau.';
    $('err').textContent=err;if(err)return;
    var tx={type:t,amount:st.amount,acc:st.acc,date:st.date,note:st.memo};
    if(t==='chi'||t==='thu')tx.cat=st.cat;
    if(t==='chuyen')tx.to=st.to;
    if(t==='ung'||t==='giu')tx.person=canonPerson(st.person);
    var edit=st.editId,old=edit?findTx(edit):null;
    tx.time=(old&&old.time)?old.time:nowTime();
    if(edit){removeTx(edit)}
    addTx(tx);
    var a=acc(tx.acc);
    if(edit){toast('Đã cập nhật.');stack.pop();draw('pop',cur().sy||0);return}
    afterSave('Đã lưu. '+a.name+' còn '+fmt(a.bal)+'.');
  }

  function spNew(){return {cur:'VND',payer:'Hào',people:[],who:[],mode:'eq',val:{},touched:{},tam:'',tcat:'Ăn uống'}}
  function spOn(){return st.type==='chi'&&st.kind!=='none'}
  function spForeign(){return st.type==='chi'&&st.kind==='trip'&&!!st.sp&&st.sp.cur!=='VND'}

    if(st.kind==='trip'){var t=trip(st.tripId);sp.people=t.people.slice();sp.who=t.people.slice()}

  function spTamHtml(){

  function spSetMode(m,reset){

    if(m==='pc'&&n){var base=Math.floor(1e6/n)/1e4,sum=0;who.forEach(function(p,i){var v=i===n-1?Math.round((100-sum)*1e4)/1e4:base;sp.val[p]=v;sum+=v})}
    if(m==='am'){
      var a=spAmt();
      if(a&&n){var sh=tShares({amt:a,cur:sp.cur,who:who,mode:'eq',val:{},payer:sp.payer});who.forEach(function(p){sp.val[p]=sh[p]})}

  function spRebal(){
    var sp=st.sp,m=sp.mode;if(m!=='pc'&&m!=='am')return false;
    if(!sp.touched)sp.touched={};
    var who=sp.who,free=who.filter(function(p){return !sp.touched[p]});
    Object.keys(sp.touched).forEach(function(p){if(who.indexOf(p)<0)delete sp.touched[p]});
    if(!free.length)return false;
    var total=m==='pc'?100:spAmt();if(m==='am'&&!total)return false;
    var fixed=0;who.forEach(function(p){if(sp.touched[p])fixed+=sp.val[p]||0});
    var rem=Math.max(0,total-fixed),k=Math.pow(10,m==='pc'?4:tDec(sp.cur)),base=Math.floor(rem/free.length*k+1e-9)/k,used=0;
    free.forEach(function(p,i){var v=(i===free.length-1)?Math.round((rem-used)*k)/k:base;sp.val[p]=v;used+=v});
    return true;
  }

  function spCheck(a,s){
    var sp=st.sp,cur=sp.cur,n=sp.who.length,r={ok:true,html:'',msg:''};
    if(!n){r.ok=false;r.msg='Chọn ít nhất một người để chia.';r.html=r.msg;return r}
    if(!a){r.html='Nhập số tiền để xem phần chia của từng người.';return r}
    if(sp.mode==='eq'){r.html='Chia đều '+n+' người, mỗi người khoảng '+fmtC(a/n,cur)+'.';return r}
    if(sp.mode==='sh'){var sw=0;sp.who.forEach(function(p){sw+=sp.val[p]||0});if(!sw){r.ok=false;r.msg='Cần ít nhất một hệ số lớn hơn 0.';r.html=r.msg;return r}r.html='Tổng '+String(Math.round(sw*100)/100).replace('.',',')+' phần.';return r}
    if(sp.mode==='pc'){
      var pc=0;sp.who.forEach(function(p){pc+=sp.val[p]||0});pc=Math.round(pc*100)/100;
      if(Math.abs(pc-100)>0.01){var d=Math.round((100-pc)*100)/100;r.ok=false;r.msg='Tổng phần trăm đang là '+String(pc).replace('.',',')+', cần đủ 100.';r.html='Đã chia '+String(pc).replace('.',',')+'% · '+(d>0?'còn thiếu ':'dư ')+String(Math.abs(d)).replace('.',',')+'% (≈ '+fmtC(Math.abs(a*d/100),cur)+')';return r}
      r.html='Đủ 100%.';return r;
    }
    var sum=0;sp.who.forEach(function(p){sum+=sp.val[p]||0});
    var df=tRound(a-sum,cur);
    if(Math.abs(df)>=(cur==='VND'?0.5:0.005)){
      r.ok=false;r.msg='Tổng các phần chưa bằng số tiền: '+(df>0?'còn thiếu ':'dư ')+fmtC(Math.abs(df),cur)+'.';
      r.html='Đã chia '+fmtC(sum,cur)+' / '+fmtC(a,cur)+' · '+(df>0?'còn thiếu ':'dư ')+'<b>'+fmtC(Math.abs(df),cur)+'</b> <button type="button" class="link" data-act="spFill">Dồn vào '+esc(sp.who[sp.who.length-1])+'</button>';
      return r;
    }

  }

  function barPath(x,y,w,h){if(h<=0)return '';var r=Math.min(3,h,w/2);return 'M'+x+','+(y+h)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+w-r)+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+' V'+(y+h)+' Z'}

  /* ================= GOOGLE DRIVE (v1.0.3) ================= */
  var GCID='101064927337-u26ldlfqen8btdss0jkoe76dbveavcec.apps.googleusercontent.com',GSCOPE='https://www.googleapis.com/auth/drive.file';
  var GFOLDER='Sổ Tài Chính - Sao lưu',GKEEP=30,GTOK=null,GEXP=0,gisP=null,GBUSY=false;
  function loadGis(){
    if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
    if(gisP)return gisP;
    gisP=new Promise(function(res,rej){var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=function(){res()};s.onerror=function(){gisP=null;rej(new Error('Không tải được Google. Kiểm tra mạng.'))};document.head.appendChild(s)});

  /* Lấy quyền truy cập Drive. Phải gọi ngay trong lần bấm của người dùng để iPhone không chặn cửa sổ đăng nhập. */
  function gToken(){
    return new Promise(function(res,rej){
      if(GTOK&&Date.now()<GEXP-60000)return res(GTOK);
      if(!(window.google&&google.accounts&&google.accounts.oauth2)){loadGis().catch(function(){});return rej(new Error('Đang kết nối tới Google, đợi vài giây rồi bấm lại.'))}
      var tc=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:GSCOPE,prompt:S.drive?'':'consent',
        callback:function(r){if(!r||r.error)return rej(new Error('Google từ chối: '+((r&&r.error)||'không rõ lý do')));GTOK=r.access_token;GEXP=Date.now()+(+r.expires_in||3600)*1000;res(GTOK)},
        error_callback:function(e){rej(new Error(e&&e.type==='popup_closed'?'Đã đóng cửa sổ đăng nhập Google.':'Không mở được cửa sổ đăng nhập Google.'))}});
      tc.requestAccessToken();
    });
  }
  function gApi(url,opt){
    opt=opt||{};opt.headers=opt.headers||{};opt.headers.Authorization='Bearer '+GTOK;
    return fetch(url,opt).then(function(r){
      if(r.status===401){GTOK=null;throw new Error('Phiên Google đã hết hạn, bấm lại để đăng nhập.')}
      if(!r.ok)return r.text().then(function(t){var e=new Error('Google Drive báo lỗi '+r.status);e.status=r.status;e.body=t;throw e});
      return r.status===204?null:(opt.raw?r.text():r.json());
    });
  }
  var GD='https://www.googleapis.com/drive/v3/files',GU='https://www.googleapis.com/upload/drive/v3/files';

  function gFolder(){
    if(S.driveFolder)return gApi(GD+'/'+S.driveFolder+'?fields=id,trashed').then(function(f){if(f.trashed){S.driveFolder='';return gFolder()}return f.id},function(e){if(e.status===404){S.driveFolder='';return gFolder()}throw e});
    return gApi(GD+'?q='+gq("name="+qv(GFOLDER)+" and mimeType='application/vnd.google-apps.folder' and trashed=false")+'&fields=files(id)').then(function(r){
      if(r.files&&r.files.length){S.driveFolder=r.files[0].id;return S.driveFolder}
      return gApi(GD+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:GFOLDER,mimeType:'application/vnd.google-apps.folder'})}).then(function(f){S.driveFolder=f.id;return f.id});

  function gListBk(fid){return gApi(GD+'?q='+gq(qv(fid)+" in parents and trashed=false")+'&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime,size)').then(function(r){return r.files||[]})}
  function gUpload(){
    var data=JSON.stringify(snapshot()),name='so-tai-chinh_'+todayISO()+'.json';
    return gFolder().then(function(fid){
      return gListBk(fid).then(function(files){
        var same=files.filter(function(f){return f.name===name})[0];
        var p;
        if(same)p=gApi(GU+'/'+same.id+'?uploadType=media&fields=id',{method:'PATCH',headers:{'Content-Type':'application/json'},body:data});
        else{
          var b='stc'+Date.now(),body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:name,parents:[fid],mimeType:'application/json'})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+data+'\r\n--'+b+'--';
          p=gApi(GU+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body});
        }
        return p.then(function(){
          var old=files.filter(function(f){return f.name!==name}).slice(GKEEP-1);
          return Promise.all(old.map(function(f){return gApi(GD+'/'+f.id,{method:'DELETE'}).catch(function(){})}));
        });
      });

  /* Định dạng số ngoại tệ khi gõ: dấu chấm phần nghìn, dấu phẩy thập phân */
  function fmtFIn(raw,c,paste){
    var dec=tDec(c),v=String(raw),ip,fp=null;
    if(v.indexOf(',')>=0){var i=v.indexOf(',');ip=v.slice(0,i);fp=v.slice(i+1)}
    else{var j=v.lastIndexOf('.');if(paste&&j>=0&&v.indexOf('.')===j&&(v.length-j-1)<=2){ip=v.slice(0,j);fp=v.slice(j+1)}else ip=v}
    ip=ip.replace(/\D/g,'');if(fp!==null)fp=fp.replace(/\D/g,'').slice(0,dec);
    if(!dec)fp=null;
    ip=ip.replace(/^0+(?=\d)/,'');
    ip=ip?ip.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):(fp!==null?'0':'');
    return ip+(fp!==null?','+fp:'');
  }
  function fgnNum(v){return parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.'))||0}
  function fgnFormat(el,ev){
    var c=st.sp.cur,v=el.value,pos=el.selectionStart,d0=0,p=0,k=0;
    /* phím chấm vừa gõ = dấu thập phân (bàn phím kiểu Anh); mọi dấu chấm khác là phần nghìn */
    if(ev&&ev.data==='.'&&pos>0&&v.charAt(pos-1)==='.'&&v.indexOf(',')<0)v=v.slice(0,pos-1)+','+v.slice(pos);
    var atEnd=(pos==null||pos>=v.length);
    if(!atEnd)for(var i=0;i<pos;i++)if(/\d/.test(v.charAt(i)))d0++;
    var f=fmtFIn(v,c,ev&&ev.inputType==='insertFromPaste');if(f===el.value)return;
    el.value=f;
    if(atEnd)p=f.length;else{while(p<f.length&&k<d0){if(/\d/.test(f.charAt(p)))k++;p++}}
    try{el.setSelectionRange(p,p)}catch(e){}
  }

  /* Khoản ngoại tệ trả bằng thẻ/ngân hàng: chưa chốt thì nằm ở ngoại tệ (tạm tính); chốt sao kê xong chuyển sang VND */
  function ePend(e){return e.cur!=='VND'&&e.payer===ME&&!!e.acc&&!isW(e.acc)&&e.final==null}
  function eConv(e){return e.cur!=='VND'&&e.payer===ME&&!!e.acc&&!isW(e.acc)&&e.final!=null}
  function eCur(e){return eConv(e)?'VND':e.cur}

  function tSharesE(e){
    var s=tShares(e);if(!eConv(e))return s;
    var out={},tot=0,k;

    var d=e.final-tot;if(d){var kk=e.who.indexOf(e.payer)>=0?e.payer:e.who[0];out[kk]=(out[kk]||0)+d}

  /* chia tiền */
  function tShares(e){
    var who=e.who,out={},tot=0;
    if(!who.length)return out;
    if(e.mode==='sh'){var sw=0;who.forEach(function(w){sw+=e.val[w]||0});who.forEach(function(w){out[w]=sw?e.amt*(e.val[w]||0)/sw:0})}
    else if(e.mode==='pc'){who.forEach(function(w){out[w]=e.amt*(e.val[w]||0)/100})}
    else if(e.mode==='am'){who.forEach(function(w){out[w]=e.val[w]||0})}
    else{who.forEach(function(w){out[w]=e.amt/who.length})}
    who.forEach(function(w){out[w]=tRound(out[w],e.cur);tot+=out[w]});
    var diff=tRound(e.amt-tot,e.cur);
    if(diff){var k=who.indexOf(e.payer)>=0?e.payer:who[0];out[k]=tRound(out[k]+diff,e.cur)}
    return out;
  }
  function tBal(t,c){

    for(var k2 in b)b[k2]=tRound(b[k2],c);
    return b;
  }

  function tlSync(t){
    for(var i=txs.length-1;i>=0;i--)if(txs[i].tl&&txs[i].tripId===t.id)txs.splice(i,1);

        var who=kind==='p'?(x.d<0?o.to:o.from):'';
        txs.push({id:nextId++,type:'tl',tl:true,refKind:kind,tripId:t.id,tripName:t.name,amount:Math.abs(x.d),delta:x.d,acc:x.acc,date:x.date||o.date||TODAY_ISO,time:'12:00',note:'',what:what,who:who,part:x.k||''});
      });
    }
    t.exp.forEach(function(e){add(e,e.title,'e')});
    t.pay.forEach(function(p){add(p,p.exch?'đổi '+nC(p.amt,p.cur)+' '+p.cur+' sang VND':'','p')});

  /* gợi ý thanh toán */
  function tSuggest(t,c,direct){
    var b=tBal(t,c),lines=[],k;
    if(direct){
      for(k in b){if(k===ME)continue;if(b[k]<-0.004)lines.push({from:k,to:ME,amt:-b[k]});else if(b[k]>0.004)lines.push({from:ME,to:k,amt:b[k]})}
      return lines;
    }
    var neg=[],pos=[];
    for(k in b){if(b[k]<-0.004)neg.push([k,-b[k]]);else if(b[k]>0.004)pos.push([k,b[k]])}
    neg.sort(function(x,y){return y[1]-x[1]});pos.sort(function(x,y){return y[1]-x[1]});
    var i=0,j=0;
    while(i<neg.length&&j<pos.length){
      var x=Math.min(neg[i][1],pos[j][1]);
      lines.push({from:neg[i][0],to:pos[j][0],amt:tRound(x,c)});
      neg[i][1]-=x;pos[j][1]-=x;
      if(neg[i][1]<0.005)i++;
      if(pos[j][1]<0.005)j++;
    }
    return lines;
  }

  function tfRead(){TF.vnd=TF.vnd||{};document.querySelectorAll('.tf-v').forEach(function(el){TF.vnd[el.dataset.id]=el.value});var f=$('tf-fee');if(f)TF.fee=f.value}
  function tfInt(v){return parseInt(String(v==null?'':v).replace(/\D/g,''),10)||0}
  function tfCalc(t){
    var items=tPending(t).filter(function(e){return TF.sel[e.id]!==false}),out={items:items,p:{},f:{},alloc:{},P:0,F:0,T:0,tam:0};
    items.forEach(function(e){
      var el=$('tf-v-'+e.id),p=el?parseMoney(el):(TF.vnd&&TF.vnd[e.id]!=null?tfInt(TF.vnd[e.id]):(e.tam||0));
      out.p[e.id]=p;out.P+=p;out.tam+=(e.tam||0);
    });
    var fe=$('tf-fee');out.F=fe?parseMoney(fe):tfInt(TF.fee);
    var left=out.F;
    items.forEach(function(e,i){var f=i===items.length-1?left:Math.round(out.F*out.p[e.id]/(out.P||1));out.f[e.id]=f;left-=f;out.alloc[e.id]=out.p[e.id]+f});

  }

  }

    pend.forEach(function(e){
      var on=TF.sel[e.id]!==false,v=TF.vnd[e.id]!=null?TF.vnd[e.id]:(e.tam?e.tam.toLocaleString('vi-VN'):'');
      h+='<div class="card" style="margin-top:8px;padding:4px 10px 8px"><button type="button" class="row rowbtn" style="padding-left:0;padding-right:0" data-act="tfSel" data-a="'+e.id+'" aria-pressed="'+on+'"><span class="gsel" aria-hidden="true" style="pointer-events:none"><i class="tick" style="'+(on?'background:var(--accent);border-color:var(--accent);color:var(--accent-fg)':'')+'">'+(on?'✓':'')+'</i></span><div class="name"><div>'+esc(e.title)+'</div><small>'+fmtC(e.amt,e.cur)+' · tạm tính '+fmtF(e.tam||0)+'</small></div></button>';
      if(on)h+='<div class="amount" style="margin-top:2px"><label for="tf-v-'+e.id+'">VND gốc theo sao kê</label><div class="field"><input id="tf-v-'+e.id+'" class="money tf-v" data-id="'+e.id+'" inputmode="numeric" placeholder="0" value="'+esc(v)+'"><span class="cur">₫</span></div><div class="note" id="tf-r-'+e.id+'" style="margin:4px 0 0"></div></div>';
      h+='</div>';
    });
    h+='<div class="amount"><label for="tf-fee">Phí chuyển đổi trên sao kê (tổng, nếu có)</label><div class="field"><input id="tf-fee" class="money" inputmode="numeric" placeholder="0" value="'+esc(TF.fee||'')+'"><span class="cur">₫</span></div></div>';
    h+='<div class="card" style="margin-top:12px" id="tf-out"></div>';
    h+='<p class="note">Phí là chi phí chung của chuyến: được chia cho từng khoản theo tỷ lệ gốc rồi chia cho mọi người cùng cách chia của khoản đó. Trên lịch sử tài khoản app ghi hai dòng cho mỗi khoản (gốc, phí) giống sao kê. Sau khi chốt, tỷ giá thực được lưu làm tỷ giá tạm tính cho các khoản sau.</p>';
    h+='<button class="save" data-act="tfApply" type="button">Chốt các khoản đã chọn</button>';
    return h;
  }
  function tfApply(){
    var t=curTrip(),r=tfCalc(t);
    if(!r.items.length){toast('Chọn ít nhất một khoản.');return}
    for(var i=0;i<r.items.length;i++)if(!r.p[r.items[i].id]){toast('Nhập VND gốc cho "'+r.items[i].title+'".');return}
    var byC={};
    r.items.forEach(function(e){
      var p=r.p[e.id],f=r.f[e.id];e.final=p+f;e.fee=f;e.gross=p;
      if(e.acc&&acc(e.acc)){
        effBal(e.acc,-p);(e.eff=e.eff||[]).push({acc:e.acc,d:-p,date:TODAY_ISO,adj:1,k:'g'});
        if(f>0){effBal(e.acc,-f);e.eff.push({acc:e.acc,d:-f,date:TODAY_ISO,adj:1,k:'f'})}
      }
      var x=byC[e.cur]||(byC[e.cur]={a:0,v:0});x.a+=e.amt;x.v+=p;
    });
    t.rateAt=t.rateAt||{};
    for(var c in byC){if(byC[c].a>0){var nr=Math.round(byC[c].v/byC[c].a);if(nr>0){t.rate[c]=nr;t.rateAt[c]=TODAY_ISO;RATES[c]={v:nr,at:TODAY_ISO}}}}
    tlSync(t);
    TF={sel:{},vnd:{},fee:''};
    toast('Đã chốt '+r.items.length+' khoản, trừ '+fmtF(r.T)+'. Đã chuyển sang phần VND của chuyến.');
    back();
  }

  /* ----- Tổng kết (xem trước PDF) ----- */
  function sumSection(t,c){
    var ex=t.exp.filter(function(e){return eCur(e)===c}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
    var pays=t.pay.filter(function(p){return p.cur===c}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
    if(!ex.length&&!pays.length)return '';
    var PP=t.people,paid={},shr={},adj={},tot=0,cats={};
    PP.forEach(function(p){paid[p]=0;shr[p]=0;adj[p]=0});
    function cell(v,sign){return '<td class="num '+(sign&&v<-0.004?'neg':sign&&v>0.004?'pos':'')+'">'+(Math.abs(v)>=0.005?((sign&&v>0.004?'+':'')+(v<-0.004?'−':'')+nC(v,c)):'–')+'</td>'}
    function foot(label,map,sign){return '<tr><td colspan="2">'+label+'</td>'+PP.map(function(p){return cell(map[p]||0,sign)}).join('')+'</tr>'}
    function tbl(head1,rows,ft,note){
      return '<div class="card" style="padding:8px 10px;margin-top:10px"><div class="bcap" style="margin-bottom:4px">'+head1+'</div>'+(note?'<div class="note" style="margin:0 0 6px">'+note+'</div>':'')+'<div style="overflow-x:auto"><table class="ptable" style="font-size:12px"><thead><tr><th>Khoản</th><th>Số tiền</th>'+PP.map(function(p){return '<th>'+esc(p)+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody><tfoot>'+ft+'</tfoot></table></div></div>';
    }
    var rowsShare='',rowsPaid='';
    ex.forEach(function(e){
      var A=eAmt(e),s=tSharesE(e);paid[e.payer]=(paid[e.payer]||0)+A;tot+=A;cats[e.cat]=(cats[e.cat]||0)+A;
      PP.forEach(function(p){shr[p]+=s[p]||0});
      var lab='<td>'+esc(e.title)+'<br><small style="color:var(--ink-2)">'+dmy(e.date)+' · '+esc(e.payer)+' trả'+(ePend(e)?' · thẻ, tạm tính':eConv(e)?' · đã chốt sao kê (gốc '+fmtC(e.amt,e.cur)+')':'')+'</small></td><td class="num">'+nC(A,c)+'</td>';
      rowsShare+='<tr>'+lab+PP.map(function(p){return '<td class="num">'+(s[p]!=null?nC(s[p],c):'–')+'</td>'}).join('')+'</tr>';
      rowsPaid+='<tr>'+lab+PP.map(function(p){return '<td class="num">'+(p===e.payer?nC(A,c):'–')+'</td>'}).join('')+'</tr>';
    });
    var rowsPay='';
    pays.forEach(function(p){
      adj[p.from]+=p.amt;adj[p.to]-=p.amt;
      rowsPay+='<tr><td>'+esc(p.from)+' → '+esc(p.to)+'<br><small style="color:var(--ink-2)">'+dmy(p.date)+(p.exch?' · đổi sang VND':'')+'</small></td><td class="num">'+nC(p.amt,c)+'</td>'+PP.map(function(q){return q===p.from?cell(p.amt,true):q===p.to?cell(-p.amt,true):'<td class="num">–</td>'}).join('')+'</tr>';
    });
    var bal=tBal(t,c);
    var h='<div class="sec"><h2>'+c+(c==='VND'?' · tiền Việt':' · ngoại tệ')+'</h2><span class="sum num">Tổng chi '+fmtC(tot,c)+'</span></div>';
    if(ex.length){
      h+=tbl('Phần chi của mỗi người',rowsShare,foot('Cộng',shr),'Mỗi dòng là phần từng người phải chịu.');
      h+=tbl('Đã trả',rowsPaid,foot('Cộng đã trả',paid),'Ai đã bỏ tiền ra cho từng khoản.');
    }
    if(pays.length)h+=tbl('Đã thanh toán trong chuyến',rowsPay,foot('Cộng thanh toán',adj,true),'Dương: người đó đã trả cho người khác. Âm: người đó đã nhận lại.');
    h+='<div class="card" style="padding:8px 10px;margin-top:10px"><div class="bcap" style="margin-bottom:4px">Số dư</div><div style="overflow-x:auto"><table class="ptable" style="font-size:12px"><thead><tr><th></th>'+PP.map(function(p){return '<th>'+esc(p)+'</th>'}).join('')+'</tr></thead><tbody>'
      +'<tr><td>Đã trả</td>'+PP.map(function(p){return cell(paid[p]||0)}).join('')+'</tr>'
      +(pays.length?'<tr><td>Thanh toán</td>'+PP.map(function(p){return cell(adj[p]||0,true)}).join('')+'</tr>':'')
      +'<tr><td>Phần chi</td>'+PP.map(function(p){return cell(-(shr[p]||0),true)}).join('')+'</tr>'
      +'</tbody><tfoot><tr><td>Số dư</td>'+PP.map(function(p){return cell(bal[p]||0,true)}).join('')+'</tr></tfoot></table></div></div>';
    var sug=tSuggest(t,c,SL.direct);
    h+='<div class="card" style="margin-top:10px"><div class="bcap">Gợi ý thanh toán ('+c+')</div>'+(sug.length?sug.map(function(l){return '<div class="brow"><span>'+esc(l.from)+' → '+esc(l.to)+'</span><b class="num">'+fmtC(l.amt,c)+'</b></div>'}).join(''):'<div class="brow"><span>Đã cân bằng</span><b>–</b></div>')+'</div>';
    var ck=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
    if(ck.length)h+='<div class="card" style="margin-top:10px"><div class="bcap">Chi theo hạng mục ('+c+')</div>'+ck.map(function(k){return '<div class="brow"><span>'+esc(k)+'</span><b class="num">'+fmtC(cats[k],c)+'</b></div>'}).join('')+'</div>';
    return h;
  }
  function vSum(){
    var t=curTrip();if(!t)return head('Không tìm thấy');
    var h=head('Tổng kết chuyến đi','<span class="badge">Xem trước PDF</span>');
    h+='<div class="card"><div style="font-size:18px;font-weight:700">'+esc(t.name)+'</div><div class="note" style="margin:2px 0 0">'+esc(t.dates)+' · '+t.people.map(esc).join(', ')+'</div></div>';
    tCcys(t).forEach(function(c){h+=sumSection(t,c)});
    h+='<div class="actions"><button class="btn solid" data-act="tsExport" data-a="PDF" type="button">Xuất PDF</button><button class="btn" data-act="tsExport" data-a="Zalo" type="button">Gửi tổng kết</button></div>';
    h+='<p class="note">Mỗi loại tiền là một phần riêng, không cộng gộp khác tiền tệ. Người đi cùng xem qua file, không cần cài app.</p>';
    return h;
  }

  /* ----- Chốt chuyến đi ----- */
  function tCloseCalc(t){
    /* Chỉ VND: khoản VND và khoản thẻ ngoại tệ đã chốt. Ví ngoại tệ, ngoại tệ khác giữ trong chuyến đi */
    var paid=0,recv=0;
    t.exp.forEach(function(e){if(e.payer===ME&&eCur(e)==='VND')paid+=eAmt(e)});
    t.pay.forEach(function(p){
      if(p.cur!=='VND')return;
      if(p.to===ME)recv+=p.amt;else if(p.from===ME)recv-=p.amt;
    });
    return {paid:Math.round(paid),recv:Math.round(recv),left:Math.round(paid-recv)};
  }
  function vClose(){
    var t=curTrip();if(!t)return head('Không tìm thấy');
    var r=tCloseCalc(t),h=head('Chốt chuyến đi');
    h+='<div class="hero"><div class="label"><span>Chi phí du lịch ghi vào sổ chính</span></div><div class="big num">'+fmt(r.left)+'</div><div class="split"><span>Hạng mục Hưởng thụ · Du lịch, gắn nhãn chuyến '+esc(t.name)+'</span></div></div>';
    h+='<div class="sec"><h2>Cách tính</h2></div><div class="card">'+bro('Tôi đã trả (tiền thật)',fmt(r.paid))+bro('Đã thu lại',fmt(r.recv))+bro('Còn treo',fmt(r.left),'neg')+'</div>';
    h+='<p class="note">Chỉ tính các khoản VND và các khoản thẻ ngoại tệ đã chốt thành VND. Ví ngoại tệ và các khoản ngoại tệ khác giữ trong chuyến đi, không vào sổ chính.</p>';
    var owe=[],b0=tBal(t,'VND');t.people.forEach(function(p){if(p!==ME&&b0[p]<-0.004)owe.push(esc(p)+' còn nợ '+fmtC(-b0[p],'VND'))});
    if(owe.length)h+='<div class="warnbox" style="margin-top:12px">Chưa tất toán hết: '+owe.join('; ')+'. Nếu chốt bây giờ, các khoản này thành chi phí của bạn.</div>';
    var fo=t.ccy.filter(function(c){return unsettled(t,c)});
    if(fo.length)h+='<div class="warnbox" style="margin-top:12px">Ngoại tệ chưa cân bằng: '+fo.join(', ')+'. Phần này giữ trong chuyến đi, không vào sổ chính.</div>';
    var pend=tPending(t);
    if(pend.length)h+='<div class="warnbox" style="margin-top:12px">'+pend.length+' khoản thẻ ngoại tệ chưa chốt, chưa vào sổ chính. Cần chốt sao kê trước khi chốt chuyến đi. <button type="button" class="link" data-go="tripFix" data-a="'+t.id+'">Chốt sao kê ›</button></div>';
    h+='<div class="sec"><h2>Bút toán sẽ ghi</h2></div><div class="card">'+bro('Ứng trước, chờ nhận lại','−'+fmt(tripOwedOne(t)))+bro('Chi · Du lịch','+'+fmt(r.left))+'</div>';
    h+='<button class="save" data-act="tcDo" type="button">Chốt chuyến đi</button>';
    return h;
  }
  function tcDo(){
    var t=curTrip(),r=tCloseCalc(t);
    if(tPending(t).length){toast('Còn khoản thẻ ngoại tệ chưa chốt. Chốt sao kê trước.');return}
    t.status='settled';t.cost=r.left;
    if(r.left>0){
      var tx={id:nextId++,type:'chi',amount:r.left,acc:null,date:TODAY_ISO,cat:'Hưởng thụ · Du lịch',note:'',time:nowTime(),trip:true,tripName:t.name};
      txs.push(tx);sortTx();
    }
    toast('Đã chốt. Chi phí du lịch '+fmtF(r.left)+' đã ghi vào sổ chính.');
    stack=[{v:'trips'}];tab='more';stack=[{v:'more'},{v:'trips'}];draw('pop');
  }

  /* Thanh 000 gắn sát bàn phím: dùng visualViewport để biết bàn phím cao bao nhiêu */
  var VV=window.visualViewport;
  function kbPlace(){var b=$('kbBar');if(!b||b.hidden)return;var h=b.offsetHeight||46;var top=VV?(VV.offsetTop+VV.height-h):(window.innerHeight-h);b.style.transform='translateY('+Math.max(0,Math.round(top))+'px)'}
  function kbShow(on){var b=$('kbBar');if(!b)return;b.hidden=!on;document.body.classList.toggle('kbup',!!on);if(on)kbPlace()}
  document.addEventListener('focusin',function(e){if(e.target&&e.target.id==='amount')kbShow(true)});
  document.addEventListener('focusout',function(e){if(e.target&&e.target.id==='amount')setTimeout(function(){if(document.activeElement!==$('amount'))kbShow(false)},140)});
  document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('.kbbar,.zchip'))e.preventDefault()});
  if(VV){VV.addEventListener('resize',kbPlace);VV.addEventListener('scroll',kbPlace)}
  window.addEventListener('scroll',kbPlace,{passive:true});

  function setTabH(){document.documentElement.style.setProperty('--tabh',$('tabbar').offsetHeight+'px')}
  window.addEventListener('resize',setTabH);
  var tx0=null;
  document.addEventListener('touchstart',function(e){var t=e.touches[0];tx0=(t.clientX<28&&stack.length>1)?{x:t.clientX,y:t.clientY}:null},{passive:true});
  document.addEventListener('touchend',function(e){if(!tx0)return;var t=e.changedTouches[0];if(t.clientX-tx0.x>70&&Math.abs(t.clientY-tx0.y)<60){if($('bg'))closeSheet();else back()}tx0=null},{passive:true});

  /* ================= LƯU DỮ LIỆU (IndexedDB) ================= */
  var APP_VER='1.0.4',DBN='so-tai-chinh',KEY='state';
  function snapshot(){return {app:'so-tai-chinh',ver:1,savedAt:dmyFull(todayISO())+' '+nowTime(),state:{S:S,CATS:CATS,FAV:FAV,accounts:accounts,BUD:BUD,BUDY:BUDY,owed:owed,held:held,P:P,txs:txs,nextId:nextId,TRIPS:TRIPS,TXN:TXN,FW:FW,RATES:RATES,LAST_TRIP:LAST_TRIP}}}
  function restore(d){
    S=d.S||S;CATS=d.CATS||CATS;FAV=d.FAV||FAV;accounts=d.accounts||[];BUD=d.BUD||{};BUDY=d.BUDY||{};if(!d.BUDY&&d.S&&d.S.demo){BUD=JSON.parse(JSON.stringify(BUD_DEF));BUDY=JSON.parse(JSON.stringify(BUDY_DEF))}owed=d.owed||{};held=d.held||{};P=d.P||{};
    txs=d.txs||[];nextId=d.nextId||1;TRIPS=d.TRIPS||[];TXN=d.TXN||1;FW=d.FW||{};RATES=d.RATES||{};LAST_TRIP=d.LAST_TRIP||null;
    var mx=0;txs.forEach(function(t){if(t.id>mx)mx=t.id});if(nextId<=mx)nextId=mx+1;sortTx();
  }
  function idb(){return new Promise(function(res,rej){var r=indexedDB.open(DBN,1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
  function idbGet(){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
  function idbPut(v){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,KEY);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
  var saveT=null,SAVE_OK=true;
  function persist(now){clearTimeout(saveT);var f=function(){idbPut(JSON.stringify(snapshot().state)).then(function(){SAVE_OK=true},function(){if(SAVE_OK)toast('Không lưu được dữ liệu trên máy. Hãy sao lưu ra file.');SAVE_OK=false})};if(now)f();else saveT=setTimeout(f,400)}
  /* lưu sau mỗi thao tác làm đổi dữ liệu */
  var _draw=draw;draw=function(a,y){_draw(a,y);persist()};
  var _toast=toast;toast=function(m){_toast(m);persist()};
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')persist(true)});
  window.addEventListener('pagehide',function(){persist(true)});

  applyTheme();
  function start(){newAddState();setTabH();draw();setTabH();if(S.drive)loadGis().catch(function(){})}
  (window.indexedDB?idbGet():Promise.reject()).then(function(v){
    if(v){restore(JSON.parse(v))}else{seed();seedTrips();S.demo=true}
    start();
  },function(){seed();seedTrips();start()});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
