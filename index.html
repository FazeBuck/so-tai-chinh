<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sổ Tài Chính</title>
<meta name="description" content="Sổ thu chi cá nhân">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Tài Chính">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1426" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}html{background:#F3F1EC}@media (prefers-color-scheme:dark){html{background:#0B1426}}html,body{height:100%;overflow:hidden;overscroll-behavior:none}#scr{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}@media print{html,body{height:auto;overflow:visible}#scr{position:static;overflow:visible}}</style>
<style>html{background:var(--bg)!important}#sbar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;pointer-events:none}#scr>.app{padding-top:12px}</style>
</head>
<body>
<div id="sbar" aria-hidden="true"></div>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: một cột kiểu điện thoại; 5 tab đáy (Tổng quan, Tài khoản, Thêm, Báo cáo, Khác); các màn con mở chồng lên có nút quay lại */
:root{
  /* Bento nền giấy (v14): nền giấy, xanh đậm, chữ Plus Jakarta Sans, thẻ bento, thanh tab nổi */
  --bg:#F3F1EC;--surface:#FBFAF7;--line:#E6E1D6;--track:#ECE8DF;--rule:#E6E1D6;
  --ink:#16213A;--ink-2:#5B6475;--ink-3:#868D9C;
  --accent:#1F4FA3;--accent-fg:#FFFFFF;--accent-soft:#E3EAF6;--link:#1F4FA3;
  --pos:#2E7D4F;--neg:#B8402F;--neg-soft:#F6E2D8;--warn:#986208;--warn-soft:#F3E7CC;
  --hero:#1F4FA3;--hero-ink:#FFFFFF;--hero-2:#D3DEF3;--hero-pos:#B6EBC9;--hero-neg:#FFC3B6;
  --nav:#16213A;--nav-on:#F3F1EC;--nav-on-ink:#16213A;--nav-off:#8D95A8;--nav-shadow:0 12px 28px -12px rgba(22,33,58,.55);
  --mint:#2E7D4F;--mint-bg:#E2EFE4;--coral:#B8452E;--coral-bg:#F6E2D8;--amber:#986208;--amber-bg:#F3E7CC;--lilac:#5747BE;--lilac-bg:#E7E3F3;--tile-on:#FFFFFF;
  --s1:#2F6FD6;--s2:#D9622B;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#7A5A3A;--s8:#6B5BD2;--s9:#0E8A9A;--s10:#A8781F;--sx:#9AA7AE;
  --k-food:#C8561F;--k-home:#7A5A3A;--k-move:#2F6FD6;--k-fun:#B04A7A;--k-edu:#6B5BD2;--k-give:#A8781F;--k-inc:#2E7D4F;--k-xfer:#5B6475;--k-ppl:#1F4FA3;
  --scrim:rgba(15,20,28,.45);
  --shadow:0 1px 2px rgba(22,33,58,.04);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:var(--font);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1426;--surface:#15213A;--line:#22304C;--track:#22304C;--rule:#22304C;--ink:#EEF2FA;--ink-2:#B0BBD3;--ink-3:#8592AD;
    --accent:#7FA2FF;--accent-fg:#0B1426;--accent-soft:#1D2D52;--link:#8EADFF;--pos:#6FD69C;--neg:#FF9A84;--neg-soft:#3A2228;--warn:#F1C164;--warn-soft:#352C1C;
    --hero:#2F5EE0;--hero-ink:#FFFFFF;--hero-2:#D6E1FF;--hero-pos:#B6EBC9;--hero-neg:#FFC3B6;
    --nav:#2B3C61;--nav-on:#EEF2FA;--nav-on-ink:#0B1426;--nav-off:#A9B6D2;--nav-shadow:0 14px 30px -10px rgba(0,0,0,.8);--nav-edge:rgba(255,255,255,.14);
    --mint:#6FD69C;--mint-bg:#15332A;--coral:#FF9A84;--coral-bg:#3A2228;--amber:#F1C164;--amber-bg:#352C1C;--lilac:#B4A7FF;--lilac-bg:#262447;--tile-on:#0B1426;
    --s1:#82AAF2;--s2:#F0915C;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2FA23A;--s7:#C9A27E;--s8:#A9A0EE;--s9:#4CC3D1;--s10:#E3BE68;--sx:#8791A3;
    --k-food:#FF9E78;--k-home:#C9A27E;--k-move:#8FB0FF;--k-fun:#F08CC4;--k-edu:#B4A7FF;--k-give:#E3BE68;--k-inc:#6FD69C;--k-xfer:#B0BBD3;--k-ppl:#8EADFF;
    --scrim:rgba(4,8,16,.6);--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0B1426;--surface:#15213A;--line:#22304C;--track:#22304C;--rule:#22304C;--ink:#EEF2FA;--ink-2:#B0BBD3;--ink-3:#8592AD;
    --accent:#7FA2FF;--accent-fg:#0B1426;--accent-soft:#1D2D52;--link:#8EADFF;--pos:#6FD69C;--neg:#FF9A84;--neg-soft:#3A2228;--warn:#F1C164;--warn-soft:#352C1C;
    --hero:#2F5EE0;--hero-ink:#FFFFFF;--hero-2:#D6E1FF;--hero-pos:#B6EBC9;--hero-neg:#FFC3B6;
    --nav:#2B3C61;--nav-on:#EEF2FA;--nav-on-ink:#0B1426;--nav-off:#A9B6D2;--nav-shadow:0 14px 30px -10px rgba(0,0,0,.8);--nav-edge:rgba(255,255,255,.14);
    --mint:#6FD69C;--mint-bg:#15332A;--coral:#FF9A84;--coral-bg:#3A2228;--amber:#F1C164;--amber-bg:#352C1C;--lilac:#B4A7FF;--lilac-bg:#262447;--tile-on:#0B1426;
    --s1:#82AAF2;--s2:#F0915C;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2FA23A;--s7:#C9A27E;--s8:#A9A0EE;--s9:#4CC3D1;--s10:#E3BE68;--sx:#8791A3;
    --k-food:#FF9E78;--k-home:#C9A27E;--k-move:#8FB0FF;--k-fun:#F08CC4;--k-edu:#B4A7FF;--k-give:#E3BE68;--k-inc:#6FD69C;--k-xfer:#B0BBD3;--k-ppl:#8EADFF;
    --scrim:rgba(4,8,16,.6);--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:430px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 100px}
.num{font-variant-numeric:tabular-nums}
.head{display:flex;align-items:center;gap:8px;padding-block:16px 8px;min-height:60px}
.head h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;flex:none}
.badge{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--warn-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--neg)}
.btn.block{width:100%;padding:12px;font-size:15px}
.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.hero .label{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-block:2px 10px}
.hero .split{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--ink-2)}
.hero .split b{color:var(--ink);font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.sec{margin-block:22px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:13px;font-weight:600;color:var(--ink-2);margin:0;text-transform:uppercase;letter-spacing:.05em}
.sec .sum{font-size:13px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.rowbtn{width:100%;background:none;border-width:1px 0 0;border-style:solid;border-color:var(--line);text-align:left}
.rowbtn:first-child{border-top:0}
.chev{color:var(--ink-3);font-size:18px;flex:none}
.ico{flex:none;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.row .name{flex:1;min-width:0}
.row .name div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name small{color:var(--ink-3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap}
.row .name small.wrap{white-space:normal}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.note{font-size:12px;color:var(--ink-3);margin:6px 4px 0}
.empty{padding:16px;color:var(--ink-3);font-size:13px;text-align:center}
.cols3{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:6px;text-align:left}
.cols3 small{display:block;color:var(--ink-2);font-size:12px}.cols3 b{font-size:14px;white-space:nowrap}

/* Thanh tab */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,430px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}
.tab{border:0;background:none;padding:10px 2px;border-radius:12px;color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab.add{background:var(--accent);color:var(--accent-fg);font-size:13px}
.tab.add[aria-selected="true"]{outline:2px solid var(--accent);outline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Biểu mẫu */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:none;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
.amount{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.amount label{font-size:13px;color:var(--ink-2)}
.amount .field{display:flex;align-items:baseline;gap:6px}
.amount input{flex:1;min-width:0;border:0;background:none;font-size:34px;font-weight:700;letter-spacing:-.02em;padding:0;outline:none}
.amount .cur{font-size:22px;font-weight:600;color:var(--ink-2)}
.amount.t-chi input,.amount.t-tra input{color:var(--neg)}.amount.t-thu input,.amount.t-nhan input{color:var(--pos)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
.allchip{font-weight:700}
.ghead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.gsel{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:600;padding:4px 0}
.gsel .tick{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;line-height:1}
.gsel[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.block{margin-top:16px}
.block>.cap{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll .chip{flex:none;white-space:nowrap}
.acc-chip small{display:block;font-size:11px;font-weight:400;opacity:.8}
.acc-chip{border-radius:12px;padding:8px 12px;text-align:left}
.text{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.text:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.two>div{min-width:0}
.two .cap{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
input[type="date"].text{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:46px}
.err{color:var(--neg);font-size:13px;margin-top:8px;min-height:18px}
.save{width:100%;margin-top:14px;border:0;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.save.ghost{background:var(--surface);color:var(--neg);border:1px solid var(--line);margin-top:10px}

/* Bảng chọn */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(100%,430px);max-height:86%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700}
.sheet header button{border:0;background:none;color:var(--accent);font-weight:600}
.sheet .body{overflow:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.grp{margin-bottom:14px}.grp h3{font-size:13px;color:var(--ink-2);margin:0 0 6px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--ink-2)}.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:min(92%,400px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* Tháng, tìm kiếm */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-block:8px}
.monthnav button{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;font-size:18px}
.monthnav b{font-size:15px}
.dayh{font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 4px 6px;display:flex;justify-content:space-between}

/* Thanh tiến độ và biểu đồ */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--neg)}
.tag{font-size:12px;font-weight:600}.tag.warn{color:var(--warn)}.tag.over{color:var(--neg)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:6px}
.donutwrap{display:flex;justify-content:center;padding-block:4px}
.chartsvg{width:100%;height:auto;display:block}
.chartsvg text{fill:var(--ink-2);font-family:var(--font);font-size:10px}
.chartsvg .grid{stroke:var(--line);stroke-width:1}
.readout{font-size:13px;color:var(--ink-2);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{color:var(--ink-2);font-weight:600;border-top:0}
.switch{width:46px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}.switch[aria-checked="true"]::after{transform:translateX(18px)}
.subcats{padding:0 14px 12px 62px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.subcats div{display:flex;justify-content:space-between}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink)}

/* Chuyển màn hình mượt */
.app{overflow-x:clip}
.chip,.seg button,.tab,.btn,.back,.switch,.save,.monthnav button{transition:background-color .15s,color .15s,border-color .15s,transform .1s}
.chip:active,.btn:active,.tab:active,.back:active,.save:active,.monthnav button:active{transform:scale(.96)}
.rowbtn{transition:background-color .12s}
.rowbtn:active{background:var(--accent-soft)}
.bar i{transition:width .3s ease}
@media (prefers-reduced-motion:no-preference){
  .a-push{animation:aPush .26s cubic-bezier(.2,.8,.2,1)}
  .a-pop{animation:aPop .26s cubic-bezier(.2,.8,.2,1)}
  .a-tab{animation:aTab .2s ease-out}
  @keyframes aPush{from{opacity:0;transform:translateX(32px)}}
  @keyframes aPop{from{opacity:0;transform:translateX(-32px)}}
  @keyframes aTab{from{opacity:0;transform:translateY(8px)}}
  .a-sr{animation:aSR .3s cubic-bezier(.25,.8,.25,1)}.a-sl{animation:aSL .3s cubic-bezier(.25,.8,.25,1)}.a-sf{animation:aSF .25s ease-out}
  @keyframes aSR{from{opacity:0;transform:translateX(18px)}}@keyframes aSL{from{opacity:0;transform:translateX(-18px)}}@keyframes aSF{from{opacity:.2}}
  .sheet-bg{animation:bgIn .2s ease-out}
  .sheet{animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}
  .sheet-bg.closing{animation:bgOut .18s ease-in forwards}
  .sheet-bg.closing .sheet{animation:sheetOut .18s ease-in forwards}
  @keyframes bgIn{from{opacity:0}}
  @keyframes bgOut{to{opacity:0}}
  @keyframes sheetIn{from{transform:translateY(40px);opacity:.6}}
  @keyframes sheetOut{to{transform:translateY(40px);opacity:0}}
}
.daterow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-block:8px}
.daterow>div{min-width:0}
.daterow label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:4px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px;flex:1;margin-inline:8px;min-width:0}
.pkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkgrid .chip{padding:10px 4px;text-align:center}
.accgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.accgrid .chip{min-width:0;white-space:normal}
.acc-chip b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptable tr[data-act]{cursor:pointer}
.ptable tr.sel td{background:var(--accent-soft)}
.ptable td,.ptable th{padding:9px 4px;font-size:13px}
.ptable td:first-child{padding-left:6px;white-space:nowrap}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:10px}
.filters button{text-align:left;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:0}
.filters small{display:block;font-size:11px;color:var(--ink-2)}
.filters b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.mini:first-child{border-top:0}
.mini .lbl{width:44%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.mini .track i{display:block;height:100%;border-radius:99px}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--tabh,58px);width:min(100%,430px);padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:4}
.savebar .save{margin:0;flex:1;width:auto;min-width:0}
.savebar .save.ghost{flex:0 0 auto;width:auto;padding-inline:22px}
.has-bar{padding-bottom:82px}
.herobtn{width:100%;text-align:left;display:block;cursor:pointer}
.herobtn .label .go{color:var(--ink-3);font-size:20px;line-height:1}
.hero.tap:active{background:var(--accent-soft)}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.twin .card small{display:block;color:var(--ink-2);font-size:12px}.twin .card b{font-size:16px;white-space:nowrap}
.readout b{color:var(--ink)}
.rtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:2px}
.rtabs button{border:0;background:none;padding:10px 2px;font-weight:600;font-size:15px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.rtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.seg,.rtabs{position:relative}.seg button,.rtabs button{position:relative;z-index:1;transition:color .2s}
.segind{position:absolute;z-index:0;border-radius:11px;background:var(--surface);box-shadow:var(--shadow);pointer-events:none;will-change:transform}
.segind.tabind{border-radius:2px;background:var(--accent);box-shadow:none}
.seg.sliding button[aria-pressed="true"]{background:none;box-shadow:none}.rtabs.sliding button[aria-selected="true"]{border-bottom-color:transparent}
.ctl{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.ctl .seg{flex:1;min-width:0}
.ctl .seg.two2{flex:0 0 auto}
.ctl .seg button{padding:8px 10px}
.navline{display:flex;gap:8px;align-items:center;margin-top:10px}
.navline .monthnav{flex:1;min-width:0;margin:0}
.navline .pill{margin-inline:6px;padding:7px 8px;font-size:14px}
.fbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;height:36px;font-weight:600;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px}
.fbtn[data-on="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.fbtn i{font-style:normal;background:var(--accent);color:var(--accent-fg);border-radius:99px;min-width:18px;height:18px;padding:0 5px;font-size:11px;display:grid;place-items:center}
.pill2{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:14px}
.pill2 small{color:var(--ink-3);font-size:12px;font-weight:500}
.pill2 b{font-weight:700;flex:1;text-align:left;white-space:nowrap}
.pill2 span{color:var(--ink-3);font-size:11px}
.chip:disabled{opacity:.4;cursor:default}
.navline .fbtn{height:40px}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.ptable td.num{white-space:nowrap}
.navline{margin-bottom:10px}
.ptable tbody tr td{padding-block:7px}
.fnote{font-size:12px;color:var(--ink-2);margin:8px 2px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.words{font-size:12px;color:var(--ink-2);min-height:16px;margin-top:2px}
.autotag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;margin-left:8px}
.quick .chip.soft{font-variant-numeric:tabular-nums}
button.mini{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
button.mini:first-child{border-top:0}
button.mini:active{background:var(--accent-soft)}
.statbtn{background:none;border:0;padding:0;text-align:left;border-radius:8px}
.statbtn:active{background:var(--accent-soft)}
.detlink{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;color:var(--accent);margin-top:8px;text-align:left}

/* Thanh phụ kiện gắn sát mép trên bàn phím iOS (v8) */
.kbbar{position:fixed;top:0;left:0;right:0;margin-inline:auto;width:min(100%,430px);height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-top:1px solid var(--line);z-index:30;will-change:transform}
.kbbar[hidden]{display:none}
.kbkey{height:34px;min-width:64px;padding:0 14px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-weight:700;font-size:16px;color:var(--ink);touch-action:manipulation}
.kbkey.done{color:var(--accent);border-color:transparent;background:none;font-size:15px;min-width:0}
.kbkey:active{background:var(--accent-soft)}
.kbbar .sp{flex:1}
.kbup .zchip{display:none}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.avw{display:inline-flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}
.avw small{font-size:11px;color:var(--ink-2);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.av[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.av.sm{width:34px;height:34px;font-size:14px;flex:none;background:var(--accent-soft);color:var(--ink);border-color:transparent}
.ptable th{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right;padding:6px 4px;white-space:nowrap}
.ptable th:nth-child(1),.ptable td:nth-child(1){text-align:left}
.ptable tfoot td{font-weight:600;border-top:1px solid var(--line);padding-block:7px}
.ptable td:nth-child(1){min-width:96px;white-space:normal}.ptable td,.ptable th{padding-inline:3px;font-size:12px}
/* Số dư theo kỳ (v7) */
.pill2 b{overflow:hidden;text-overflow:ellipsis}
.ptabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:12px;position:relative}
.ptabs::-webkit-scrollbar{display:none}
.amtc{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}.amtc .rbal{font-size:11.5px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.dayh .dtot{display:flex;gap:10px;font-weight:600;white-space:nowrap}.dayh .dtot b{font-weight:700}.dayh .dtot .pos{color:var(--pos)}.dayh .dtot .neg{color:var(--neg)}
.ptabs,.scroll,.hx{overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.ptabs button{margin-bottom:0!important}.ptabs{border-bottom:0;box-shadow:inset 0 -1px 0 var(--line)}
.ptabs button{flex:none;border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0}
.brow span{color:var(--ink-2)}
.brow.total{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.brow.total span{color:var(--ink);font-weight:600}
.brow b{white-space:nowrap}
.bcap{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.row.cat .name div:first-child{font-weight:400;color:var(--ink-2)}
.row.cat .amt{font-weight:500}

/* ===== Giao diện Sổ xanh (v13) ===== */
.num{font-variant-numeric:tabular-nums lining-nums}
.head{padding-block:18px 10px}
.head h1{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.005em}
.head.main h1{font-size:30px;line-height:1.15}
.head h1 .hello{display:block;font-size:14px;font-style:italic;font-weight:400;color:var(--ink-2);margin-bottom:2px}
.back{border-radius:50%;background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.badge{border-radius:4px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:12px;color:var(--warn);background:var(--warn-soft)}
.hero{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:24px;padding:20px 20px 18px;box-shadow:none;color:var(--hero-ink);background-color:var(--hero);
  background-image:radial-gradient(240px 180px at 105% -10%,var(--hero-glow),transparent 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px)}
.hero::after{content:"";position:absolute;right:-34px;bottom:-48px;width:170px;height:170px;border-radius:50%;border:1.5px solid rgba(255,255,255,.14);box-shadow:0 0 0 18px rgba(255,255,255,.04);pointer-events:none;z-index:-1}
.hero .label{color:var(--hero-2);font-family:var(--serif);font-style:italic;font-size:16px;gap:8px}
.hero .big{font-family:var(--serif);font-weight:600;font-size:38px;letter-spacing:-.01em;line-height:1.15;margin-block:6px 12px}
.hero .split{border-top:1px solid rgba(255,255,255,.2);color:var(--hero-2);gap:6px 16px}
.hero .split b{color:var(--hero-ink)}
.hero .link{color:var(--hero-ink);font-family:var(--font);font-style:normal;font-weight:500;font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 10px}
.hero .neg{color:var(--hero-neg)}.hero .pos{color:var(--hero-pos)}
.herobtn .label .go{color:var(--hero-2)}
.hero.tap:active{background-color:var(--hero);filter:brightness(1.1)}
.hero :focus-visible,.hero.tap:focus-visible{outline-color:var(--hero-ink)}
.card{border-radius:16px}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:14px 4px}
.cols3>*{padding-inline:10px;min-width:0}
.cols3>*+*{border-left:1px dashed var(--line)}
.cols3 small{font-family:var(--serif);font-style:italic;font-size:13px}
.cols3 b{display:block;font-family:var(--serif);font-weight:600;font-size:15px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.twin .card small{font-family:var(--serif);font-style:italic;font-size:13px}.twin .card b{font-family:var(--serif);font-weight:600;font-size:17px}
.sec{margin-block:26px 2px;padding-bottom:6px;border-bottom:1.5px solid var(--rule)}
.sec h2{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;text-wrap:balance}
.sec .link{font-family:var(--serif);font-style:italic;font-weight:600;font-size:14px}
.sec .sum{font-family:var(--serif);font-weight:600;font-size:14px;color:var(--ink-2)}
.list{background:transparent;border:0;border-radius:0;overflow:visible;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec+.list,.dayh+.list{border-top:0}
.row{padding:12px 2px}
.row .amt{font-family:var(--serif);font-weight:600;font-size:15.5px}
.row.cat .amt{font-weight:500}
.rowbtn:active{background:var(--accent-soft)}
.dayh{font-family:var(--serif);font-style:italic;font-size:13px;font-weight:400;margin:16px 2px 2px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.ico{--c:var(--accent);width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--c) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--c)}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tag{font-family:var(--serif);font-style:italic;font-weight:600;padding:2px 8px;border-radius:4px}
.tag.warn{background:var(--warn-soft)}.tag.over{background:var(--neg-soft)}
.bar{height:6px;background:var(--track)}
.mini .track{background:var(--track)}
.seg{background:var(--track)}
.amount input{font-family:var(--serif);font-weight:600}
.brow b{font-family:var(--serif);font-weight:600}
.bcap{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--ink-2)}
.sheet-bg{background:var(--scrim)}
.sheet header span{font-family:var(--serif);font-size:18px;font-weight:600}
.kv span:last-child .num{font-family:var(--serif)}
/* Thanh tab */
.tabbar{border-top:1.5px solid var(--rule);grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:500;color:var(--ink-3);border-radius:10px;min-width:0}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:none;color:var(--accent);font-weight:700}
.tab.add,.tab.add[aria-selected="true"]{background:none;color:var(--ink-2);font-size:11px;outline:0}
.tab.add[aria-selected="true"]{color:var(--accent);font-weight:700}
.tab.add .plus{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-22px;border:3px solid var(--surface);box-shadow:0 8px 18px -6px color-mix(in srgb,var(--accent) 75%,transparent)}
.tab.add .plus svg{width:24px;height:24px;stroke-width:2.4}
.tab.add:focus-visible{outline:2px solid var(--accent)}
/* Chọn giao diện */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.thm{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:7px;text-align:left;color:var(--ink);min-width:0;transition:border-color .15s,box-shadow .15s}
.thm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thm:active{transform:scale(.97)}
.thm .pv{position:relative;display:block;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.thm .pv .hf{position:absolute;inset:0;display:block}
.thm .pv i{position:absolute;display:block;border-radius:3px}
.thm b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.thm small{font-size:11px;color:var(--ink-3);margin-top:-4px}
.thm .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;box-sizing:border-box}
.thm[aria-pressed="true"] .rad{border:5px solid var(--accent)}
.sprow{min-height:66px;box-sizing:border-box;gap:10px}
.sprow .name{flex:1 1 40px}
.sprow .sp-val{background:var(--bg);height:42px;min-height:42px;box-sizing:border-box;padding:8px 10px;text-align:right;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sprow .sp-am{flex:0 1 190px;width:auto;min-width:0}
.sprow .sp-sm{flex:0 0 64px;width:64px}
.sprow .sp-out{min-width:96px;text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.sprow .sp-unit{color:var(--ink-2);min-width:14px;font-size:14px;font-weight:600}
.sp-check{font-size:13px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.sp-check.bad{background:var(--warn-soft)}
.sp-check .link{margin-left:6px}
.addp{display:flex;gap:8px;margin-top:10px}
.addp .text{flex:1;min-width:0}
.save:disabled{opacity:.45}

/* ===== Giao diện Bento nền giấy (v14) — ghi đè v13 ===== */
body{font-size:15px;letter-spacing:-.003em}
.head{padding-block:20px 10px}
.head h1,.head.main h1{font-family:var(--font);font-weight:800;font-size:22px;letter-spacing:-.015em;font-style:normal}
.head.main h1{font-size:26px}
.head h1 .hello{font-style:normal;font-weight:500;font-size:13px;color:var(--ink-3)}
.back{width:40px;height:40px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.back{display:grid;place-items:center;padding:0}.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}
.badge{font-family:var(--font);font-style:normal;font-weight:700;font-size:11px;border-radius:99px;color:var(--warn);background:var(--warn-soft)}
.btn{border:0;border-radius:12px;background:var(--surface);color:var(--link);box-shadow:var(--shadow);font-weight:700}
.btn.solid{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--neg)}
.link{color:var(--link);font-weight:700}
/* Thẻ xanh lớn */
.hero{border-radius:26px;padding:20px;background-color:var(--hero);background-image:none;box-shadow:none;color:var(--hero-ink)}
.hero::before{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none;z-index:-1}
.hero::after{right:30px;top:60px;bottom:auto;width:120px;height:120px;border:0;box-shadow:none;background:rgba(255,255,255,.07)}
.hero .label{font-family:var(--font);font-style:normal;font-size:13px;font-weight:600;color:var(--hero-2)}
.hero .big{font-family:var(--font);font-weight:800;font-size:34px;letter-spacing:-.025em;line-height:1.15;margin-block:4px 14px}
.hero .split{border-top:1px solid rgba(255,255,255,.18)}
.hero .link{color:var(--hero-ink);font-weight:600;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
.hero.tap:active{filter:brightness(1.08)}
.qacts{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:2px}
.qacts button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;min-width:0}
.qacts button:active{background:rgba(255,255,255,.26);transform:scale(.97)}
.qacts svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Đầu trang Tổng quan */
.hhead{display:flex;align-items:center;gap:12px;padding-block:22px 14px}
.hhead .avatar{width:44px;height:44px;border-radius:15px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.hhead .ht{flex:1;min-width:0}
.hhead .ht small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.hhead .ht b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:15px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.iconbtn svg path{stroke-linejoin:round}
.bkbtn{position:relative}.bkbtn i{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);display:none}
.bkbtn[data-st="dirty"] i{display:block;background:var(--warn,#d98a00)}.bkbtn[data-st="ok"] i{display:block;background:var(--pos)}
.bkbtn[data-st="busy"] svg{animation:bkp 1s ease-in-out infinite}@keyframes bkp{50%{opacity:.35}}
/* Ô bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{border:0;text-align:left;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--tb);color:var(--ink);transition:transform .1s}
.tile:active{transform:scale(.97)}

.tile .ti{width:28px;height:28px;border-radius:10px;background:var(--tc);color:var(--tile-on);display:grid;place-items:center;flex:none}
.tile .ti svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:17px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.t-mint{--tb:var(--mint-bg);--tc:var(--mint)}.t-coral{--tb:var(--coral-bg);--tc:var(--coral)}.t-amber{--tb:var(--amber-bg);--tc:var(--amber)}.t-lilac{--tb:var(--lilac-bg);--tc:var(--lilac)}

.sec .link{font-family:var(--font);font-style:normal;font-weight:700;font-size:13px}
.sec .sum{font-family:var(--font);font-weight:700;font-size:13px}
.card{border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.list{background:var(--surface);border:0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.sec+.list,.dayh+.list{border-top:0}
.row{padding:11px 14px}

.twin .card b{font-family:var(--font);font-weight:800;font-size:17px}
.tag{font-family:var(--font);font-style:normal;font-weight:700;border-radius:99px}
.bcap{font-family:var(--font);font-style:normal;font-size:12px;font-weight:700;color:var(--ink-3)}
.brow b{font-family:var(--font);font-weight:700}
.kv span:last-child .num{font-family:var(--font)}
.amount{border:0;border-radius:20px;box-shadow:var(--shadow)}

.seg{background:var(--track);border-radius:14px}

.chip{border-color:transparent;background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

.thm{border-color:transparent;box-shadow:var(--shadow);border-radius:16px}

.tabbar{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 28px),402px);height:64px;padding:0 6px;border:0;border-radius:22px;background:var(--nav);box-shadow:var(--nav-shadow);align-items:center;grid-template-columns:repeat(5,minmax(0,1fr))}

.tab svg{width:44px;height:44px;padding:11px;border-radius:14px;box-sizing:border-box;stroke-width:2}

.tab:focus-visible{outline:2px solid var(--nav-on);outline-offset:-4px}

.has-bar{padding-bottom:110px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:14px}

<script>
(function(){
  /* ================= DỮ LIỆU MẪU (v7: bàn phím số trong app, số dư theo kỳ, gộp tài khoản ngừng sử dụng) ================= */
  var S={hide:false,faceid:false,drive:false,auto:'weekly',last:'',demo:true,lastFile:''};
  var CATS={
    chi:[
      {g:'Ăn uống',i:['Ăn tiệm','Cafe','Đi chợ/siêu thị','Nhậu']},
      {g:'Đi lại',i:['Taxi/thuê xe','Xăng xe','Bảo dưỡng, gửi xe']},
      {g:'Gia đình',i:['Gia đình','Bồ']},
      {g:'Nhà cửa',i:['Mua sắm đồ đạc','Sửa chữa nhà cửa']},
      {g:'Hóa đơn, dịch vụ',i:['Điện thoại','Internet, truyền hình','Giúp việc','Subscription','Phí ngân hàng']},
      {g:'Sức khỏe',i:['Bảo hiểm','Khám bệnh, thuốc','Thể thao','Body care']},

    ],
    thu:[{g:'Thu nhập',i:['Lương','Thưởng','Tiền lãi','Được cho/tặng','Thu khác']}]
  };
  var FAV={chi:['Ăn uống · Ăn tiệm','Ăn uống · Cafe','Đi lại · Taxi/thuê xe','Gia đình · Bồ','Phát triển bản thân · Giao lưu, quan hệ','Hưởng thụ · Du lịch'],
           thu:['Thu nhập · Lương','Thu nhập · Tiền lãi','Thu nhập · Thưởng','Thu nhập · Được cho/tặng']};
  var accounts=[
    {id:'cash',name:'Ví tiền mặt',group:'bank',bal:6000000,active:true},
    {id:'tcb',name:'Techcombank',group:'bank',bal:5000000,active:true},
    {id:'vib',name:'VIB',group:'bank',bal:8000000,active:true},
    {id:'card',name:'Thẻ tín dụng VIB',group:'credit',bal:-3000000,active:true},
    {id:'ssi',name:'SSI',group:'invest',bal:25000000,active:true},
    {id:'momo',name:'Ví điện tử cũ',group:'bank',bal:0,active:false}
  ];
  var GROUPS=[['bank','Tiền mặt và ngân hàng'],['credit','Thẻ tín dụng'],['invest','Đầu tư']];
  var GNAME={bank:'Tiền mặt / Ngân hàng',credit:'Thẻ tín dụng',invest:'Đầu tư'};

  function dayTot(list){var m={};list.forEach(function(t){if(t.type!=='thu'&&t.type!=='chi')return;var o=m[t.date]||(m[t.date]={thu:0,chi:0});o[t.type]+=t.amount});return m}
  function dayHead(d,o){
    var r='';if(o){if(o.thu)r+='<span>Thu <b class="num pos">'+fmt(o.thu)+'</b></span>';if(o.chi)r+='<span>Chi <b class="num neg">'+fmt(o.chi)+'</b></span>'}
    return '<div class="dayh"><span>'+dayLabel(d)+'</span>'+(r?'<span class="dtot">'+r+'</span>':'')+'</div>';
  }
  function dayLabel(d){return d===TODAY_ISO?'Hôm nay':d===daysAgo(1)?'Hôm qua':dmy(d)}
  /* 1.0.8: danh sách dài chỉ vẽ trước 60 dòng, phần còn lại vẽ dần khi cuộn tới */
  var LZ={},LZN=0,LZ_FIRST=60,LZ_STEP=120;
  function groupedChunk(list,from,to,last,o){
    var h='',open=false;o=o||{};
    for(var i=from;i<to;i++){var t=list[i];
      if(t.date!==last){if(open)h+='</div>';h+=dayHead(t.date,o.dt&&o.dt[t.date])+'<div class="list">';last=t.date;open=true}
      h+=txRow(t,o.bm);
    }
    return {h:h+(open?'</div>':''),last:last};
  }
  function groupedTx(list,bm){
    if(!list.length)return '<div class="empty">Không có giao dịch nào</div>';
    var o={dt:dayTot(list),bm:bm||null};
    var n=Math.min(list.length,LZ_FIRST),r=groupedChunk(list,0,n,'',o);
    if(n>=list.length)return r.h;
    var id='z'+(++LZN);LZ[id]={list:list,i:n,last:r.last,o:o};
    setTimeout(lzCheck,0);
    return r.h+'<div class="lz" data-lz="'+id+'"></div>';
  }
  function lzCheck(){
    var ms=document.querySelectorAll('.lz');
    for(var k=0;k<ms.length;k++){var m=ms[k],z=LZ[m.dataset.lz];if(!z){m.parentNode.removeChild(m);continue}
      if(m.getBoundingClientRect().top>window.innerHeight+1400)continue;
      var to=Math.min(z.list.length,z.i+LZ_STEP),first=z.list[z.i],pre='',j=z.i;
      /* các dòng cùng ngày với nhóm trước thì nối vào nhóm đó */
      while(j<to&&z.list[j].date===z.last){pre+=txRow(z.list[j],z.o.bm);j++}
      if(pre){var lists=m.parentNode.querySelectorAll('.list'),lastL=null;for(var q=lists.length-1;q>=0;q--){if(lists[q].compareDocumentPosition(m)&Node.DOCUMENT_POSITION_FOLLOWING){lastL=lists[q];break}}if(lastL)lastL.insertAdjacentHTML('beforeend',pre);else m.insertAdjacentHTML('beforebegin','<div class="list">'+pre+'</div>')}
      var r=groupedChunk(z.list,j,to,z.last,z.o);m.insertAdjacentHTML('beforebegin',r.h);z.i=to;z.last=r.last;
      if(z.i>=z.list.length){delete LZ[m.dataset.lz];m.parentNode.removeChild(m)}
      else setTimeout(lzCheck,30);
    }
  }

  function balCur(){return BL.all?active().map(function(x){return x.id}):BL.accs.filter(function(id){return acc(id)})}
  function selIds(){return balCur()}
  function balSet(ids){
    var actIds=active().map(function(x){return x.id});
    if(actIds.every(function(x){return ids.indexOf(x)>=0})&&ids.every(function(x){return actIds.indexOf(x)>=0})){BL.all=true;BL.accs=[]}
    else{BL.all=false;BL.accs=ids}
  }
  function balLabel(){
    if(BL.all)return 'Tất cả tài khoản đang dùng ('+active().length+')';
    var sel=BL.accs.filter(function(id){return acc(id)});
    if(!sel.length)return 'Chưa chọn tài khoản';
    for(var i=0;i<GROUPS.length;i++){
      var gi=active().filter(function(a){return a.group===GROUPS[i][0]}).map(function(a){return a.id});
      if(gi.length>1&&gi.length===sel.length&&gi.every(function(x){return sel.indexOf(x)>=0}))return GROUPS[i][1]+' ('+gi.length+')';
    }
    return sel.length===1?acc(sel[0]).name:acc(sel[0]).name+' + '+(sel.length-1)+' tài khoản';
  }
  function flowOf(t,ids){
    if(t.trip)return 0;
    var a=ids.indexOf(t.acc)>=0,b=!!t.to&&ids.indexOf(t.to)>=0,m=t.amount;
    switch(t.type){
      case 'chi':case 'ung':case 'tra':return a?-m:0;
      case 'thu':case 'giu':case 'nhan':return a?m:0;
      case 'chuyen':return (b?m:0)-(a?m:0);
      case 'dc':case 'tl':return a?t.delta:0;
    }
    return 0;
  }
  function flowKey(t){
    switch(t.type){
      case 'chi':return parts(t.cat)[0];
      case 'thu':return parts(t.cat)[1];
      case 'chuyen':return 'Chuyển khoản';
      case 'ung':return 'Ứng hộ';
      case 'giu':return 'Giữ hộ';
      case 'nhan':return 'Nhận lại';
      case 'tra':return 'Trả lại';
    }
    if(t.type==='tl')return 'Ứng trước chuyến đi';
    return 'Điều chỉnh số dư';
  }

  function vBal(){

      var f=flowOf(t,ids);
      if(t.date>=r.from)fromOn+=f;
      if(t.date>r.to)after+=f;
      if(!t.trip&&t.date>=r.from&&t.date<=r.to&&(ids.indexOf(t.acc)>=0||(t.to&&ids.indexOf(t.to)>=0)))inR.push({t:t,f:f});
    });

    if(!ids.length)return h+'<div class="card empty" style="margin-top:12px">Chưa chọn tài khoản nào. Bấm ô Tài khoản ở trên để chọn.</div>';
    h+='<div class="hero" style="margin-top:10px"><div class="label"><span>Số dư hiện tại</span></div><div class="big num '+(curBal<0?'neg':'')+'" style="margin-bottom:0">'+fmt(curBal)+'</div></div>';
    h+='<div class="seg" style="margin-top:12px">'+[['month','Tháng'],['quarter','Quý'],['year','Năm']].map(function(x){return '<button type="button" data-act="bp" data-a="'+x[0]+'" aria-pressed="'+(BL.p===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
    var selKey=rangeOf(BL.p,BL.m).key;
    h+='<div class="ptabs" id="bstrip" role="tablist" aria-label="Chọn kỳ">'+balStripItems().map(function(x){return '<button type="button" role="tab" data-act="bsel" data-a="'+x.m+'" aria-selected="'+(rangeOf(BL.p,x.m).key===selKey)+'">'+x.label+'</button>'}).join('')+'</div>';
    h+='<div class="card" style="margin-top:12px"><div class="bcap">'+esc(r.label)+'</div><div class="brow"><span>Số dư đầu kỳ</span><b class="num">'+fmt(open)+'</b></div><div class="brow"><span>Số dư cuối kỳ</span><b class="num">'+fmt(close)+'</b></div><div class="brow total"><span>Chênh lệch</span><b class="num '+(net<0?'neg':net>0?'pos':'')+'">'+sgnFmt(net)+'</b></div></div>';
    if(ids.length>1)h+='<p class="note">Chuyển khoản giữa các tài khoản đang chọn không tính vào chênh lệch.</p>';
    if(!inR.length){
      h+='<div class="card empty" style="margin-top:12px">Kỳ này chưa có giao dịch ở tài khoản đã chọn.</div>';
    }else if(BL.p==='month'){
      var dn={},last='',opened=false,bm=runBal(ids);

      inR.forEach(function(x){
        if(x.t.date!==last){if(opened)h+='</div>';h+='<div class="dayh"><span>'+dayLabel(x.t.date)+'</span><span class="num">'+sgnFmt(dn[x.t.date])+'</span></div><div class="list">';last=x.t.date;opened=true}

      mks.reverse().forEach(function(mk){

        var mnet=0,map={},aft=0;
        arr.forEach(function(x){mnet+=x.f;var kk=flowKey(x.t);map[kk]=(map[kk]||0)+x.f});
        txs.forEach(function(t){if(t.date>mk+'-31')aft+=flowOf(t,ids)});
        var ks=Object.keys(map).filter(function(q){return Math.round(map[q])!==0}).sort(function(a,b){return Math.abs(map[b])-Math.abs(map[a])});

        function crow(label,v){return '<div class="row cat"><div class="name"><div>'+esc(label)+'</div></div><div class="amt num '+(v<0?'neg':'pos')+'">'+sgnFmt(v)+'</div></div>'}

        h+='</div>';

  /* ================= NGƯỜI (ỨNG HỘ / GIỮ HỘ) ================= */
  function lastDate(n){for(var i=0;i<txs.length;i++)if(txs[i].person===n)return txs[i].date;return ''}
  function pStat(n){var o=Math.max(owed[n]||0,0),h=Math.max(held[n]||0,0);return {o:o,h:h,bal:o+h>0,n:txs.filter(function(t){return t.person===n}).length,last:lastDate(n)}}
  function curPerson(){return cur().a.split('|').slice(1).join('|')}
  function personSuggest(){
    var now=Date.parse(todayISO()),out=[];
    Object.keys(P).forEach(function(n){
      if(P[n].hidden)return;var s=pStat(n),last=s.last;
      if(s.bal||(last&&(now-Date.parse(last))/864e5<=15))out.push({n:n,last:last||''});
    });
    out.sort(function(a,b){return a.last<b.last?1:a.last>b.last?-1:0});
    return out.slice(0,8).map(function(x){return x.n});
  }
  function personNote(){

    var c=canonPerson(v);
    if(P[c]){var s=pStat(c);nt.textContent=s.bal?'Đang theo dõi «'+c+'».':(P[c].hidden?'«'+c+'» đang ẩn, lưu xong sẽ hiện lại.':'Dùng lại «'+c+'» (đã tất toán).')}
    else nt.textContent='Người mới «'+v+'», app sẽ tự thêm khi lưu.';
  }
  function personRow(n){
    var s=pStat(n),sub='';
    if(s.bal)sub=(s.o?'Nợ bạn':'')+(s.o&&s.h?' · ':'')+(s.h?'Bạn giữ hộ':'');
    else sub=s.n?'Lần cuối '+dmy(s.last):'Chưa có giao dịch';

  }

  function movePerson(src,dst){
    txs.forEach(function(t){if(t.person===src)t.person=dst});

  /* Tự học: gợi ý hạng mục, tài khoản, người theo lịch sử (số tiền gần giống, giờ trong ngày, mới hay cũ) */
  function predictAgg(type,amount,ctxCat){
    var now=new Date(),hn=now.getHours()+now.getMinutes()/60,agg={cat:{},acc:{},to:{},person:{}},base=Date.parse(todayISO());
    txs.forEach(function(t){
      if(t.type!==type)return;
      if(ctxCat&&t.cat!==ctxCat)return;
      var w=Math.pow(0.5,Math.max(0,(base-Date.parse(t.date))/864e5)/90);
      if(amount>0)w*=Math.exp(-Math.abs(Math.log(t.amount/amount))/0.4);
      if(t.time){var h=parseInt(t.time.slice(0,2),10)+parseInt(t.time.slice(3,5),10)/60,dh=Math.abs(h-hn);dh=Math.min(dh,24-dh);w*=dh<=1.5?1:dh<=3?0.6:0.3}
      if(t.cat)agg.cat[t.cat]=(agg.cat[t.cat]||0)+w;
      agg.acc[t.acc]=(agg.acc[t.acc]||0)+w;
      if(t.to)agg.to[t.to]=(agg.to[t.to]||0)+w;
      if(t.person)agg.person[t.person]=(agg.person[t.person]||0)+w;
    });
    return agg;
  }
  function best(map){var bk=null,bv=0,sum=0;for(var k in map){sum+=map[k];if(map[k]>bv){bv=map[k];bk=k}}return {key:bk,conf:sum?bv/sum:0,w:bv}}
  function applyAuto(){
    if(st.editId||!$('amount')||spForeign())return;
    var amt=parseMoney($('amount'));if(!amt)return;
    var t=st.type,agg=predictAgg(t,amt),b;
    if((t==='chi'||t==='thu')&&!st.catManual){b=best(agg.cat);if(b.key&&b.conf>=0.4&&b.w>=0.05){st.cat=b.key;st.catAuto=true}else if(st.catAuto){st.cat=null;st.catAuto=false}}
    if(!st.accManual){var a2=((t==='chi'||t==='thu')&&st.cat)?predictAgg(t,amt,st.cat):agg;b=best(a2.acc);if(b.key&&b.conf>=0.4&&b.w>=0.05&&acc(b.key)&&acc(b.key).active){st.acc=b.key;st.accAuto=true}}
    if(t==='chuyen'&&!st.toManual){b=best(agg.to);if(b.key&&b.conf>=0.4&&b.w>=0.05&&acc(b.key)&&acc(b.key).active&&b.key!==st.acc)st.to=b.key}
    fixTo();
    if((t==='ung'||t==='giu')&&!st.personManual){b=best(agg.person);var pi=$('person');if(b.key&&b.conf>=0.5&&b.w>=0.05&&(!pi.value.trim()||st.personAuto)){pi.value=b.key;st.personAuto=true}}
    renderForm();
  }
  function words(n){
    if(!n)return '';var p=[],x=n,v=Math.floor(x/1e9);
    if(v){p.push(v+' tỷ');x-=v*1e9}
    v=Math.floor(x/1e6);if(v){p.push(v+' triệu');x-=v*1e6}
    v=Math.floor(x/1e3);if(v){p.push(v+' nghìn');x-=v*1e3}
    if(x)p.push(x+' đồng');
    return p.join(' ')+(x?'':' đồng');
  }

  var FREQ=null,FREQK='';
  function accFreq(){
    var k=txs.length+'|'+nextId;if(FREQ&&FREQK===k)return FREQ;
    var f={},d1=daysAgo(365),d3=daysAgo(90);
    txs.forEach(function(t){if(t.date<d1)return;var w=t.date>=d3?2:1;if(t.acc)f[t.acc]=(f[t.acc]||0)+w;if(t.to)f[t.to]=(f[t.to]||0)+w});
    FREQ=f;FREQK=k;return f;
  }
  function byFreq(list,idOf){var f=accFreq();return list.map(function(x,i){return [x,i]}).sort(function(a,b){return (f[idOf(b[0])]||0)-(f[idOf(a[0])]||0)||a[1]-b[1]}).map(function(x){return x[0]})}

  function spSetMode(m,reset){
    var sp=st.sp,who=sp.who,n=who.length;sp.mode=m;
    if(reset){sp.val={};sp.touched={}}
    if(m==='sh')who.forEach(function(p){if(reset||!sp.val[p])sp.val[p]=1});
    if(m==='pc'&&n){var base=Math.floor(1e6/n)/1e4,sum=0;who.forEach(function(p,i){var v=i===n-1?Math.round((100-sum)*1e4)/1e4:base;sp.val[p]=v;sum+=v})}
    if(m==='am'){
      var a=spAmt();
      if(a&&n){var sh=tShares({amt:a,cur:sp.cur,who:who,mode:'eq',val:{},payer:sp.payer});who.forEach(function(p){sp.val[p]=sh[p]})}
      else who.forEach(function(p){sp.val[p]=''});

  }
  /* Tự cân bằng: người chưa được nhập tay chia đều phần còn lại (100% hoặc tổng tiền) */
  function spRebal(){
    var sp=st.sp,m=sp.mode;if(m!=='pc'&&m!=='am')return false;
    if(!sp.touched)sp.touched={};
    var who=sp.who,free=who.filter(function(p){return !sp.touched[p]});
    Object.keys(sp.touched).forEach(function(p){if(who.indexOf(p)<0)delete sp.touched[p]});
    if(!free.length)return false;
    var total=m==='pc'?100:spAmt();if(m==='am'&&!total)return false;
    var fixed=0;who.forEach(function(p){if(sp.touched[p])fixed+=sp.val[p]||0});
    var rem=Math.max(0,total-fixed),k=Math.pow(10,m==='pc'?4:tDec(sp.cur)),base=Math.floor(rem/free.length*k+1e-9)/k,used=0;
    free.forEach(function(p,i){var v=(i===free.length-1)?Math.round((rem-used)*k)/k:base;sp.val[p]=v;used+=v});
    return true;
  }
  function spWriteVals(skipEl){

  function spCheck(a,s){

    if(!a){r.html='Nhập số tiền để xem phần chia của từng người.';return r}
    if(sp.mode==='eq'){r.html='Chia đều '+n+' người, mỗi người khoảng '+fmtC(a/n,cur)+'.';return r}
    if(sp.mode==='sh'){var sw=0;sp.who.forEach(function(p){sw+=sp.val[p]||0});if(!sw){r.ok=false;r.msg='Cần ít nhất một hệ số lớn hơn 0.';r.html=r.msg;return r}r.html='Tổng '+String(Math.round(sw*100)/100).replace('.',',')+' phần.';return r}
    if(sp.mode==='pc'){
      var pc=0;sp.who.forEach(function(p){pc+=sp.val[p]||0});pc=Math.round(pc*100)/100;
      if(Math.abs(pc-100)>0.01){var d=Math.round((100-pc)*100)/100;r.ok=false;r.msg='Tổng phần trăm đang là '+String(pc).replace('.',',')+', cần đủ 100.';r.html='Đã chia '+String(pc).replace('.',',')+'% · '+(d>0?'còn thiếu ':'dư ')+String(Math.abs(d)).replace('.',',')+'% (≈ '+fmtC(Math.abs(a*d/100),cur)+')';return r}
      r.html='Đủ 100%.';return r;
    }
    var sum=0;sp.who.forEach(function(p){sum+=sp.val[p]||0});
    var df=tRound(a-sum,cur);

      r.ok=false;r.msg='Tổng các phần chưa bằng số tiền: '+(df>0?'còn thiếu ':'dư ')+fmtC(Math.abs(df),cur)+'.';
      r.html='Đã chia '+fmtC(sum,cur)+' / '+fmtC(a,cur)+' · '+(df>0?'còn thiếu ':'dư ')+'<b>'+fmtC(Math.abs(df),cur)+'</b> <button type="button" class="link" data-act="spFill">Dồn vào '+esc(sp.who[sp.who.length-1])+'</button>';

  }

  function donut(g,total){

    if(total>0){
      g.forEach(function(x){
        var len=x.total/total*C,gap=g.length>1?Math.min(2,len):0,vis=Math.max(len-gap,0.5);
        s+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+slotColor(x.slot)+'" stroke-width="22" stroke-dasharray="'+vis+' '+(C-vis)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
        off+=len;

  var ME='Hào',TRIPS=[],TXN=1;

  /* Tỷ giá gợi ý toàn app: tự cập nhật sau mỗi lần chốt sao kê; có ngày để cảnh báo lỗi thời */
  var RATES={SGD:{v:19500,at:'2026-08-10'},MYR:{v:5700,at:'2026-08-10'}};

  function rateDef(c){return RATES[c]?RATES[c].v:(RATE0[c]||0)}
  function rateAtOf(t,c){return (t&&t.rateAt&&t.rateAt[c])||null}
  function rateAge(at){if(!at)return null;return Math.floor((new Date(TODAY_ISO+'T00:00:00')-new Date(at+'T00:00:00'))/864e5)}
  function rateStale(t,c){var d=rateAge(rateAtOf(t,c));return d!=null&&d>30}
  function fmtAmtIn(n,c){return c==='VND'?Math.round(n).toLocaleString('vi-VN'):n.toLocaleString('vi-VN',{maximumFractionDigits:tDec(c)})}
  /* Định dạng số ngoại tệ khi gõ: dấu chấm phần nghìn, dấu phẩy thập phân */
  function fmtFIn(raw,c,paste){
    var dec=tDec(c),v=String(raw),ip,fp=null;
    if(v.indexOf(',')>=0){var i=v.indexOf(',');ip=v.slice(0,i);fp=v.slice(i+1)}
    else{var j=v.lastIndexOf('.');if(paste&&j>=0&&v.indexOf('.')===j&&(v.length-j-1)<=2){ip=v.slice(0,j);fp=v.slice(j+1)}else ip=v}
    ip=ip.replace(/\D/g,'');if(fp!==null)fp=fp.replace(/\D/g,'').slice(0,dec);
    if(!dec)fp=null;
    ip=ip.replace(/^0+(?=\d)/,'');
    ip=ip?ip.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):(fp!==null?'0':'');
    return ip+(fp!==null?','+fp:'');
  }
  function fgnNum(v){return parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.'))||0}
  function fgnFormat(el,ev){
    var c=st.sp.cur,v=el.value,pos=el.selectionStart,d0=0,p=0,k=0;
    /* phím chấm vừa gõ = dấu thập phân (bàn phím kiểu Anh); mọi dấu chấm khác là phần nghìn */
    if(ev&&ev.data==='.'&&pos>0&&v.charAt(pos-1)==='.'&&v.indexOf(',')<0)v=v.slice(0,pos-1)+','+v.slice(pos);
    var atEnd=(pos==null||pos>=v.length);
    if(!atEnd)for(var i=0;i<pos;i++)if(/\d/.test(v.charAt(i)))d0++;
    var f=fmtFIn(v,c,ev&&ev.inputType==='insertFromPaste');if(f===el.value)return;
    el.value=f;
    if(atEnd)p=f.length;else{while(p<f.length&&k<d0){if(/\d/.test(f.charAt(p)))k++;p++}}
    try{el.setSelectionRange(p,p)}catch(e){}
  }
  var TCATS=['Ăn uống','Di chuyển','Lưu trú','Vui chơi','Mua sắm','Khác'];

  function trip(id){for(var i=0;i<TRIPS.length;i++)if(TRIPS[i].id===id)return TRIPS[i]}
  function curTrip(){return trip(cur().a)}
  function tDec(c){return (c==='VND'||c==='JPY'||c==='KRW')?0:2}
  function tRound(n,c){var k=Math.pow(10,tDec(c));return Math.round(n*k)/k}
  function nC(n,c){return Math.abs(n).toLocaleString('vi-VN',{minimumFractionDigits:tDec(c),maximumFractionDigits:tDec(c)})}
  function fmtC(n,c){if(S.hide)return '••••••';return (n<0?'−':'')+nC(n,c)+(c==='VND'?' ₫':' '+c)}
  function sgC(n,c){return (n>0.004?'+':'')+fmtC(n,c)}
  function pNum(str){
    var s=String(str==null?'':str).trim().replace(/\s/g,'');if(!s)return 0;
    if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'').replace(',','.');
    else if(s.indexOf(',')>=0)s=s.replace(',','.');
    var n=parseFloat(s);return isNaN(n)?0:n;
  }
  function amtParse(str,c){return c==='VND'?(parseInt(String(str).replace(/\D/g,''),10)||0):pNum(str)}
  function amtStr(n,c){return c==='VND'?Math.round(n).toLocaleString('vi-VN'):nC(n,c)}
  function isW(id){return (id||'').indexOf('w-')===0}
  function accName(id){return isW(id)?'Ví '+id.slice(2)+' (tiền mặt)':acc(id).name}
  function tCcys(t){return ['VND'].concat(t.ccy)}
  /* Khoản ngoại tệ trả bằng thẻ/ngân hàng: chưa chốt thì nằm ở ngoại tệ (tạm tính); chốt sao kê xong chuyển sang VND */
  function ePend(e){return e.cur!=='VND'&&e.payer===ME&&!!e.acc&&!isW(e.acc)&&e.final==null}
  function eConv(e){return e.cur!=='VND'&&e.payer===ME&&!!e.acc&&!isW(e.acc)&&e.final!=null}
  function eCur(e){return eConv(e)?'VND':e.cur}
  function eAmt(e){return eConv(e)?e.final:e.amt}
  function tSharesE(e){
    var s=tShares(e);if(!eConv(e))return s;
    var out={},tot=0,k;
    for(k in s){out[k]=e.amt?Math.round(s[k]*e.final/e.amt):0;tot+=out[k]}
    var d=e.final-tot;if(d){var kk=e.who.indexOf(e.payer)>=0?e.payer:e.who[0];out[kk]=(out[kk]||0)+d}
    return out;
  }
  function bro(l,v,cls){return '<div class="brow"><span>'+l+'</span><b class="num '+(cls||'')+'">'+v+'</b></div>'}
  function av(n,on,act){return '<span class="avw"><button type="button" class="av" data-act="'+act+'" data-a="'+esc(n)+'" aria-pressed="'+on+'" aria-label="'+esc(n)+'">'+esc(n.charAt(0).toUpperCase())+'</button><small>'+esc(n)+'</small></span>'}
  function avS(n){return '<div class="av sm" aria-hidden="true">'+esc(n.charAt(0).toUpperCase())+'</div>'}

  /* chia tiền */
  function tShares(e){
    var who=e.who,out={},tot=0;
    if(!who.length)return out;
    if(e.mode==='sh'){var sw=0;who.forEach(function(w){sw+=e.val[w]||0});who.forEach(function(w){out[w]=sw?e.amt*(e.val[w]||0)/sw:0})}
    else if(e.mode==='pc'){who.forEach(function(w){out[w]=e.amt*(e.val[w]||0)/100})}
    else if(e.mode==='am'){who.forEach(function(w){out[w]=e.val[w]||0})}
    else{who.forEach(function(w){out[w]=e.amt/who.length})}
    who.forEach(function(w){out[w]=tRound(out[w],e.cur);tot+=out[w]});
    var diff=tRound(e.amt-tot,e.cur);
    if(diff){var k=who.indexOf(e.payer)>=0?e.payer:who[0];out[k]=tRound(out[k]+diff,e.cur)}
    return out;
  }
  function tBal(t,c){
    var b={};t.people.forEach(function(p){b[p]=0});
    t.exp.forEach(function(e){
      if(eCur(e)!==c)return;
      b[e.payer]=(b[e.payer]||0)+eAmt(e);
      var s=tSharesE(e);for(var k in s)b[k]=(b[k]||0)-s[k];
    });
    t.pay.forEach(function(p){if(p.cur!==c)return;b[p.from]=(b[p.from]||0)+p.amt;b[p.to]=(b[p.to]||0)-p.amt});
    for(var k2 in b)b[k2]=tRound(b[k2],c);
    return b;
  }
  function unsettled(t,c){var b=tBal(t,c);for(var k in b)if(Math.abs(b[k])>=0.005)return true;return false}
  function tAllZero(t){return tCcys(t).every(function(c){return !unsettled(t,c)})}
  function tPending(t){return t.exp.filter(ePend)}
  /* Sổ chính chỉ có tài khoản VND: ứng trước chỉ tính phần VND (ngoại tệ, ví ngoại tệ giữ trong chuyến đi) */
  function tripOwedParts(t){var v=tBal(t,'VND')[ME]||0;return v>0.004?[{c:'VND',v:v}]:[]}

  function tripOwedVND(){var s=0;TRIPS.forEach(function(t){if(t.status==='open')s+=tripOwedOne(t)});return s}

  function fwHist(c){
    var out=[];
    TRIPS.forEach(function(t){
      t.exp.forEach(function(e){(e.eff||[]).forEach(function(x){if(x.acc==='w-'+c)out.push({d:x.date||e.date,t:e.title,tn:t.name,v:x.d})})});

  function tlSync(t){
    for(var i=txs.length-1;i>=0;i--)if(txs[i].tl&&txs[i].tripId===t.id)txs.splice(i,1);

      });
    }

  /* gợi ý thanh toán */
  function tSuggest(t,c,direct){
    var b=tBal(t,c),lines=[],k;
    if(direct){
      for(k in b){if(k===ME)continue;if(b[k]<-0.004)lines.push({from:k,to:ME,amt:-b[k]});else if(b[k]>0.004)lines.push({from:ME,to:k,amt:b[k]})}
      return lines;
    }
    var neg=[],pos=[];
    for(k in b){if(b[k]<-0.004)neg.push([k,-b[k]]);else if(b[k]>0.004)pos.push([k,b[k]])}
    neg.sort(function(x,y){return y[1]-x[1]});pos.sort(function(x,y){return y[1]-x[1]});
    var i=0,j=0;
    while(i<neg.length&&j<pos.length){
      var x=Math.min(neg[i][1],pos[j][1]);
      lines.push({from:neg[i][0],to:pos[j][0],amt:tRound(x,c)});
      neg[i][1]-=x;pos[j][1]-=x;
      if(neg[i][1]<0.005)i++;
      if(pos[j][1]<0.005)j++;
    }
    return lines;
  }

  function tfRead(){TF.vnd=TF.vnd||{};document.querySelectorAll('.tf-v').forEach(function(el){TF.vnd[el.dataset.id]=el.value});var f=$('tf-fee');if(f)TF.fee=f.value}
  function tfInt(v){return parseInt(String(v==null?'':v).replace(/\D/g,''),10)||0}
  function tfCalc(t){
    var items=tPending(t).filter(function(e){return TF.sel[e.id]!==false}),out={items:items,p:{},f:{},alloc:{},P:0,F:0,T:0,tam:0};
    items.forEach(function(e){
      var el=$('tf-v-'+e.id),p=el?parseMoney(el):(TF.vnd&&TF.vnd[e.id]!=null?tfInt(TF.vnd[e.id]):(e.tam||0));
      out.p[e.id]=p;out.P+=p;out.tam+=(e.tam||0);
    });
    var fe=$('tf-fee');out.F=fe?parseMoney(fe):tfInt(TF.fee);
    var left=out.F;
    items.forEach(function(e,i){var f=i===items.length-1?left:Math.round(out.F*out.p[e.id]/(out.P||1));out.f[e.id]=f;left-=f;out.alloc[e.id]=out.p[e.id]+f});

  }
